# Shop, hosted stack for a single Linux server (UpCloud or any other). Pulls PUBLISHED images
# pinned by tag; nothing is built on the server. Not for a home install: that is
# deploy/docker-compose.yml. Runbook: deploy/hosted/RUNBOOK.md.
#
# Always run it through deploy/hosted/compose.sh (or deploy/hosted/deploy.sh): the wrapper pins
# the project name "shop-hosted", reads deploy/hosted/.env and refuses any other project, so it
# can never address the home stack ("shop") or the test stack ("shop-hosted-test").
#
# Only Caddy publishes ports (80, 443). The API, OCR and every other service are reachable
# on the internal network only.
name: shop-hosted

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  # HTTPS front. Gets and renews the certificate for SHOP_DOMAIN by itself (needs DNS pointing
  # at this server and ports 80 and 443 open).
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?set SHOP_DOMAIN in deploy/hosted/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/hosted/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates: keep, or Let's Encrypt rate limits bite after a rebuild
      - caddy-config:/config
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  api:
    image: ${SHOP_API_IMAGE:-ghcr.io/sunday-studio/shop-api}:${SHOP_API_TAG:?set SHOP_API_TAG (a version, never latest) in deploy/hosted/.env}
    # The hosted (many households, paid) server is its own binary in the same image. The image's
    # default entrypoint is the single-household `shop`, which this stack must never run.
    entrypoint: ["/usr/local/bin/shop-hosted"]
    command: ["serve"]
    restart: unless-stopped
    read_only: true                # nothing is written outside /data (volume) and /tmp (memory)
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes: ["shop-data:/data"]
    env_file:
      # Secrets (mode 600, git-ignored): SHOP_SEALER_KEY, ADMIN_TOKEN_HASH, SHOP_APPLE_SIWA_KEY,
      # SHOP_APPLE_IAP_KEY. Template: secrets.env.example. deploy.sh preflight requires the file.
      - path: ./secrets.env
        required: false
    environment:
      SHOP_MODE: hosted
      SHOP_ADDR: ":8080"
      SHOP_DATA_DIR: /data
      SHOP_CONTROL_DB: /data/control.db      # the control database: accounts, devices, plans, grants, audit
      # The admin API listens on the container's loopback only and is not published: operators use
      # `./compose.sh exec api /usr/local/bin/shop-hosted admin ...` (RUNBOOK.md).
      ADMIN_ADDR: 127.0.0.1:8081
      OCR_URL: http://ocr:8000
      OFF_USER_AGENT: "Shop/0.1 (hosted)"
      SHOP_TZ: Europe/Amsterdam
      LOGO_DEV_TOKEN: ${LOGO_DEV_TOKEN:-}
      AUTO_PRODUCTS: ${AUTO_PRODUCTS:-on}
      # Behind Caddy every request comes from Caddy's address. Without this the per-address rate
      # limits (sign-in, invite codes, nonces) would be one shared bucket for all users: one client
      # could lock everybody out. Caddy sets X-Forwarded-For; the API publishes no port of its own.
      SHOP_TRUST_PROXY: "1"
      # The production server trusts only Apple's real endpoints. Set SHOP_APPLE_ENVIRONMENT=sandbox
      # in .env for a staging server.
      SHOP_APPLE_ENVIRONMENT: ${SHOP_APPLE_ENVIRONMENT:-production}
      # TestFlight and App Review buy in the Apple sandbox against this server. true (default): such
      # purchases are accepted but flagged, capped at SHOP_APPLE_SANDBOX_MAX_DAYS and never counted
      # as revenue. false: they are refused. APPLE.md, RUNBOOK.md.
      SHOP_APPLE_ACCEPT_SANDBOX: ${SHOP_APPLE_ACCEPT_SANDBOX:-true}
      SHOP_APPLE_SANDBOX_MAX_DAYS: ${SHOP_APPLE_SANDBOX_MAX_DAYS:-30}
      SHOP_APPLE_BUNDLE_ID: ${SHOP_APPLE_BUNDLE_ID:-com.sundaystudi.Shop}
      SHOP_APPLE_TEAM_ID: ${SHOP_APPLE_TEAM_ID:-}
      SHOP_APPLE_APP_ID: ${SHOP_APPLE_APP_ID:-}
      SHOP_APPLE_SIWA_KEY_ID: ${SHOP_APPLE_SIWA_KEY_ID:-}
      SHOP_APPLE_IAP_KEY_ID: ${SHOP_APPLE_IAP_KEY_ID:-}
      SHOP_APPLE_IAP_ISSUER_ID: ${SHOP_APPLE_IAP_ISSUER_ID:-}
      SHOP_APPLE_PRODUCT_IDS: ${SHOP_APPLE_PRODUCT_IDS:-}
    mem_limit: ${API_MEM_LIMIT:-768m}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      ocr:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/shop-hosted", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  ocr:
    image: ${SHOP_OCR_IMAGE:-ghcr.io/sunday-studio/shop-ocr}:${SHOP_OCR_TAG:-ppocrv5}
    restart: unless-stopped
    mem_limit: ${OCR_MEM_LIMIT:-3g}
    memswap_limit: ${OCR_MEM_LIMIT:-3g}      # no swap for OCR: it should be killed and restarted, not thrash the disk
    # The image carries its own HEALTHCHECK (curl /healthz, 120 s start period).
    logging: *logging

  # One-shot: the backup volume is created root-owned, the API image runs as uid 65532.
  backup-init:
    image: alpine:3.20
    command: ["chown", "-R", "65532:65532", "/backup"]
    restart: "no"
    volumes: ["backups:/backup"]
    mem_limit: 32m
    logging: *logging

  # Nightly snapshot set into the backups volume: the control database plus every household
  # (database snapshot and image mirror), all with the same timestamp, and last_backup.json last.
  backup:
    image: ${SHOP_API_IMAGE:-ghcr.io/sunday-studio/shop-api}:${SHOP_API_TAG}
    entrypoint: ["/usr/local/bin/shop-hosted"]
    command: ["backup", "-schedule"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - "shop-data:/data"
      - "backups:/backup"
    environment:
      SHOP_DATA_DIR: /data
      SHOP_CONTROL_DB: /data/control.db
      SHOP_TZ: Europe/Amsterdam
      BACKUP_DIR: /backup
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backup-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    logging: *logging

  # Off-site copy of the backup volume with rclone, ENCRYPTED (an rclone crypt remote).
  # On by default: this stack refuses to deploy without it (deploy.sh preflight).
  # Credentials: deploy/hosted/offsite.env (git-ignored, mode 600), see offsite.env.example.
  offsite:
    image: rclone/rclone:1.68.2
    entrypoint: ["sh", "/offsite.sh"]
    command: ["loop"]
    restart: unless-stopped
    volumes:
      - "../offsite/offsite.sh:/offsite.sh:ro"
      - "backups:/backup"          # the only volume it sees: no household data, no keys
    env_file:
      - path: ./offsite.env
        required: false
    environment:
      OFFSITE_STATUS_FILE: /backup/offsite_status.json   # the monitor reads it from the backups volume
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:?set OFFSITE_REMOTE (an rclone crypt remote) in deploy/hosted/.env}
      OFFSITE_LABEL: ${OFFSITE_LABEL:-offsite-crypt}
      OFFSITE_PRUNE: ${OFFSITE_PRUNE:-on}
      OFFSITE_RCLONE_FLAGS: ${OFFSITE_RCLONE_FLAGS:-}
      OFFSITE_RETRY_MINUTES: ${OFFSITE_RETRY_MINUTES:-30}
    mem_limit: 256m
    depends_on:
      backup-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f offsite.sh >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging: *logging

  # Free monitoring: checks /healthz, the OCR service, the backup and off-site status files and the
  # disk every few minutes and sends a webhook and/or email on trouble. See monitor/monitor.sh, RUNBOOK.md.
  monitor:
    image: curlimages/curl:8.10.1
    entrypoint: ["sh", "/monitor.sh"]
    command: ["loop"]
    restart: unless-stopped
    user: "0:0"                  # the named volume below is root-owned
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "./monitor/monitor.sh:/monitor.sh:ro"
      - "monitor-state:/state"
      - "backups:/backup:ro"       # last_backup.json and offsite_status.json
    environment:
      MONITOR_HEALTH_URL: http://api:8080/healthz
      MONITOR_OCR_URL: http://ocr:8000/healthz
      MONITOR_BACKUP_DIR: /backup
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-300}
      MONITOR_NAME: ${SHOP_DOMAIN}
      DISK_PATH: /state            # a Docker volume lives on the disk that fills up; no host mount needed
      DISK_ALERT_PCT: ${DISK_ALERT_PCT:-80}
      QUEUE_ALERT_PENDING: ${QUEUE_ALERT_PENDING:-15}
      QUEUE_ALERT_CHECKS: ${QUEUE_ALERT_CHECKS:-3}
      ALERT_REPEAT_HOURS: ${ALERT_REPEAT_HOURS:-6}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-json}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:-}
    mem_limit: 64m
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "find /state/heartbeat -mmin -15 | grep -q . || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *logging

volumes:
  shop-data: {}
  backups: {}
  caddy-data: {}
  caddy-config: {}
  monitor-state: {}
