<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt labelling</title>
<style>
  :root { --bg:#fbfbfa; --panel:#fff; --ink:#151715; --ink2:#5a5f5a; --line:#e3e5e1; --accent:#1d6b45; --warn:#a35f00; --bad:#b3362b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101210; --panel:#181b18; --ink:#eef0ed; --ink2:#a6aba5; --line:#2b2f2b; --accent:#5cc48d; --warn:#f0b04a; --bad:#f07c70; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:2; flex-wrap:wrap; }
  header b { font-size:15px; }
  .muted { color:var(--ink2); }
  .wrap { display:grid; grid-template-columns: minmax(280px, 42%) 1fr; gap:16px; padding:16px; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .img { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:auto; max-height:calc(100vh - 90px); position:sticky; top:62px; }
  .img img { width:100%; display:block; }
  form, .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .grid { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:10px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink2); }
  input, select, textarea { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; min-width:0; }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  td, th { padding:3px; text-align:left; font-size:12px; }
  th { color:var(--ink2); font-weight:500; }
  td input, td select { width:100%; padding:4px 6px; }
  .num { width:72px; } .qty { width:62px; }
  button { font:inherit; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  .msg { font-weight:600; } .msg.bad { color:var(--bad); } .msg.ok { color:var(--accent); }
  .chip { display:inline-block; padding:1px 8px; border-radius:99px; border:1px solid var(--line); font-size:12px; margin-right:4px; color:var(--warn); }
  pre { font:12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap; margin:6px 0 0; color:var(--ink2); max-height:260px; overflow:auto; }
  .sum { font-variant-numeric: tabular-nums; }
  details { margin-top:12px; }
</style>
</head>
<body>
<header>
  <b>Receipt labelling</b>
  <span id="pos" class="muted"></span>
  <span id="progress" class="muted"></span>
  <span style="flex:1"></span>
  <button id="prev" type="button">← Prev</button>
  <button id="next" type="button">Next →</button>
  <button id="todo" type="button">Next unlabelled</button>
</header>
<div class="wrap">
  <div class="img"><img id="img" alt="receipt"></div>
  <div>
    <form id="f" autocomplete="off">
      <div class="grid">
        <label>Shop <input name="shop" list="shops" required></label>
        <label>Date <input name="date" type="date" required></label>
        <label>Total (e.g. 12,34) <input name="total" inputmode="decimal" required></label>
        <label># item lines <input name="n_items" type="number" min="0" required></label>
      </div>
      <datalist id="shops"></datalist>
      <label style="margin-top:10px">Notes <input name="notes" placeholder="optional, e.g. crumpled, faded"></label>

      <div class="row">
        <label style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)">
          <input type="checkbox" id="withLines"> Label every line too (do this for ~25 receipts across shops)
        </label>
      </div>
      <div id="linesBox" hidden>
        <table>
          <thead><tr><th>Text as printed</th><th>Kind</th><th>Qty</th><th>Unit</th><th>Unit price</th><th>Line total</th><th></th></tr></thead>
          <tbody id="lines"></tbody>
        </table>
        <div class="row">
          <button type="button" id="addLine">+ Line</button>
          <span class="sum muted" id="sum"></span>
        </div>
      </div>

      <div class="row">
        <button class="primary" type="submit">Save &amp; next unlabelled</button>
        <span class="muted">⌘/Ctrl + Enter</span>
        <span id="msg" class="msg"></span>
      </div>
    </form>

    <div class="panel" style="margin-top:16px">
      <div><b>Parser view</b> <span id="source" class="muted"></span></div>
      <div id="reasons" style="margin-top:6px"></div>
      <details open><summary class="muted">Rows rebuilt from OCR</summary><pre id="rows"></pre></details>
    </div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const f = $('#f');
let cur = null;

function money(s) {
  s = (s || '').trim().replace('€', '').trim();
  const neg = s.startsWith('-') || s.endsWith('-');
  s = s.replace(/-/g, '');
  const m = s.match(/^(\d{1,3}(?:[.\s]\d{3})*|\d+)[.,](\d{2})$/);
  if (!m) return null;
  const c = parseInt(m[1].replace(/[.\s]/g, ''), 10) * 100 + parseInt(m[2], 10);
  return neg ? -c : c;
}
const fmt = c => (c < 0 ? '-' : '') + Math.floor(Math.abs(c) / 100) + ',' + String(Math.abs(c) % 100).padStart(2, '0');

function lineRow(l = {text: '', kind: 'item', qty: 1, unit: 'pc', unit_price: '', total: ''}) {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input class="t"></td>
    <td><select class="k"><option>item</option><option>discount</option><option>deposit</option><option>bag</option></select></td>
    <td><input class="q qty" type="number" step="0.001" min="0"></td>
    <td><select class="u"><option>pc</option><option>kg</option></select></td>
    <td><input class="p num" inputmode="decimal"></td>
    <td><input class="tot num" inputmode="decimal"></td>
    <td><button type="button" class="x" title="remove">✕</button></td>`;
  tr.querySelector('.t').value = l.text;
  tr.querySelector('.k').value = l.kind;
  tr.querySelector('.q').value = l.qty;
  tr.querySelector('.u').value = l.unit === 'kg' ? 'kg' : 'pc';
  tr.querySelector('.p').value = l.unit_price || '';
  tr.querySelector('.tot').value = l.total || '';
  tr.querySelector('.x').onclick = () => { tr.remove(); updateSum(); };
  tr.addEventListener('input', updateSum);
  $('#lines').appendChild(tr);
}

function readLines() {
  return [...$('#lines').children].map(tr => ({
    text: tr.querySelector('.t').value,
    kind: tr.querySelector('.k').value,
    qty: parseFloat(tr.querySelector('.q').value) || 1,
    unit: tr.querySelector('.u').value,
    unit_price: tr.querySelector('.p').value,
    total: tr.querySelector('.tot').value,
  }));
}

function updateSum() {
  if (!$('#withLines').checked) return;
  const ls = readLines();
  let sum = 0, bad = 0, items = 0;
  for (const l of ls) { const c = money(l.total); if (c === null) bad++; else sum += c; if (l.kind === 'item') items++; }
  const total = money(f.total.value);
  const ok = total !== null && sum === total && !bad;
  $('#sum').innerHTML = `Σ lines <b>${fmt(sum)}</b>` + (total !== null ? ` vs total <b>${fmt(total)}</b>` : '') +
    (bad ? ` · ${bad} unreadable amount(s)` : '') + ` · ${items} item lines ` + (ok ? '✓' : '');
  $('#sum').style.color = ok ? 'var(--accent)' : 'var(--warn)';
  f.n_items.value = items;
}

async function load(id) {
  const r = await fetch('/api/receipt' + (id ? '?id=' + encodeURIComponent(id) : ''));
  if (!r.ok) { $('#msg').textContent = await r.text(); $('#msg').className = 'msg bad'; return; }
  cur = await r.json();
  history.replaceState(null, '', '?id=' + encodeURIComponent(cur.id));
  $('#img').src = '/img?id=' + encodeURIComponent(cur.id);
  $('#pos').textContent = `${cur.id} — ${cur.index + 1}/${cur.count}` + (cur.saved ? ' · saved' : '');
  $('#progress').textContent = `${cur.labelled} labelled, ${cur.with_lines} with lines`;
  $('#prev').disabled = !cur.prev; $('#next').disabled = !cur.next; $('#todo').disabled = !cur.next_todo;
  $('#shops').replaceChildren(...(cur.shops || []).map(s => Object.assign(document.createElement('option'), {value: s})));
  const fm = cur.form;
  f.shop.value = fm.shop || ''; f.date.value = fm.date || ''; f.total.value = fm.total || '';
  f.n_items.value = fm.n_items || 0; f.notes.value = fm.notes || '';
  $('#lines').innerHTML = '';
  (fm.lines || []).forEach(lineRow);
  const hasSavedLines = cur.saved && fm.lines !== null && fm.lines !== undefined;
  $('#withLines').checked = hasSavedLines;
  $('#linesBox').hidden = !hasSavedLines;
  $('#source').textContent = fm.source ? `(prefilled from ${fm.source})` : '(no cached OCR; run `shop-spike ocr` first)';
  $('#reasons').replaceChildren(...(cur.reasons || []).map(r => Object.assign(document.createElement('span'), {className: 'chip', textContent: r})));
  if (!(cur.reasons || []).length && fm.source) $('#reasons').textContent = 'parser found no problems';
  $('#rows').textContent = (cur.rows || []).join('\n');
  $('#msg').textContent = '';
  updateSum();
  f.total.focus();
}

$('#withLines').onchange = e => {
  $('#linesBox').hidden = !e.target.checked;
  if (e.target.checked && !$('#lines').children.length) lineRow();
  updateSum();
};
$('#addLine').onclick = () => { lineRow(); updateSum(); };
f.total.addEventListener('input', updateSum);
$('#prev').onclick = () => load(cur.prev);
$('#next').onclick = () => load(cur.next);
$('#todo').onclick = () => load(cur.next_todo);

f.onsubmit = async e => {
  e.preventDefault();
  const body = {
    shop: f.shop.value, date: f.date.value, total: f.total.value,
    n_items: parseInt(f.n_items.value, 10) || 0, notes: f.notes.value,
    lines: $('#withLines').checked ? readLines() : null,
  };
  const r = await fetch('/api/receipt?id=' + encodeURIComponent(cur.id), {method: 'POST', body: JSON.stringify(body)});
  if (!r.ok) { $('#msg').textContent = await r.text(); $('#msg').className = 'msg bad'; return; }
  $('#msg').textContent = 'Saved'; $('#msg').className = 'msg ok';
  const next = cur.next_todo || cur.next;
  if (next) setTimeout(() => load(next), 250);
};
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); f.requestSubmit(); }
});

load(new URLSearchParams(location.search).get('id'));
</script>
</body>
</html>
