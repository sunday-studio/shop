openapi: 3.0.3
info:
  title: Pantry API
  version: 0.3.0
  description: >
    Self-hosted grocery receipt tracker. Money is always integer cents.
    Timestamps are RFC3339 UTC. Errors use application/problem+json (RFC 7807).
    All /v1 routes need `Authorization: Bearer <token>` (create with `pantry token create`).
servers:
  - url: http://localhost:8080
security:
  - bearer: []

paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: All dependencies healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: One or more dependencies unhealthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /version:
    get:
      operationId: getVersion
      security: []
      responses:
        "200":
          description: Build info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

  # ---------------------------------------------------------------- shops
  /v1/shops:
    get:
      operationId: listShops
      responses:
        "200":
          description: Shops (excluding deleted)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Shop" }
    post:
      operationId: createShop
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/shops/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getShop
      responses:
        "200":
          description: Shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateShop
      description: Replaces all editable fields (send the full shop).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteShop
      responses:
        "204": { description: Soft-deleted }
        default: { $ref: "#/components/responses/Problem" }

  # ----------------------------------------------------------- categories
  /v1/categories:
    get:
      operationId: listCategories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCategory
      responses:
        "204": { description: Soft-deleted }
        default: { $ref: "#/components/responses/Problem" }

  # ------------------------------------------------------------- receipts
  /v1/receipts:
    get:
      operationId: listReceipts
      parameters:
        - { name: from, in: query, description: "inclusive, YYYY-MM-DD (local)", schema: { type: string, format: date } }
        - { name: to, in: query, description: "inclusive, YYYY-MM-DD (local)", schema: { type: string, format: date } }
        - { name: shop_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ReceiptStatus" } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Page of receipts, newest first (without lines)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: uploadReceipt
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, shop_id]
              properties:
                image: { type: string, format: binary, description: "JPEG or PNG, max 20 MB" }
                shop_id: { type: integer, format: int64 }
                purchased_at: { type: string, format: date-time, description: "overrides the date read from the receipt" }
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "409":
          description: Same image already uploaded; body holds the existing receipt id in `detail`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getReceipt
      responses:
        "200":
          description: Receipt with lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiptPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteReceipt
      responses:
        "204": { description: Deleted (image file too) }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}/image:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getReceiptImage
      responses:
        "200":
          description: Original image
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: confirmReceipt
      responses:
        "200":
          description: Marked ok by the user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}/reparse:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: force, in: query, description: "discard user edits", schema: { type: boolean, default: false } }
    post:
      operationId: reparseReceipt
      description: Re-runs the parser on stored OCR output. Refused (409) for confirmed or user-edited receipts unless force=true.
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}/reocr:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: force, in: query, schema: { type: boolean, default: false } }
    post:
      operationId: reocrReceipt
      description: Runs OCR again, then parses. Same edit protection as reparse.
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}/lines:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: createLine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptLine" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/lines/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateLine
      description: Replaces the line's editable fields and marks it user-edited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptLine" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteLine
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }

  # ------------------------------------------------------------- products
  /v1/products:
    get:
      operationId: listProducts
      description: Without q, products sorted by name. With q, fuzzy-ranked (score >= 0.5).
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "409":
          description: Barcode already used
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/barcodes/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string, pattern: "^[0-9]{8}$|^[0-9]{12,14}$" } }
    get:
      operationId: lookupBarcode
      description: Local product if known, else an Open Food Facts prefill (not saved). 404 if neither.
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BarcodeLookup" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getProduct
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateProduct
      description: Replaces editable fields (send the full product). Nutrition only changes when present.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteProduct
      responses:
        "204": { description: Soft-deleted (barcode released) }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/{id}/image:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getProductImage
      responses:
        "200":
          description: JPEG, max 1024 px
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putProductImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/{id}/nutrition:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: putNutrition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Nutrition" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteNutrition
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/{id}/aliases:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listAliases
      responses:
        "200":
          description: Receipt texts linked to this product
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alias" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/aliases/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: deleteAlias
      responses:
        "204": { description: Deleted (already-linked lines keep their product) }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/{id}/unmatched-lines:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: days, in: query, schema: { type: integer, default: 14, maximum: 365 } }
    get:
      operationId: unmatchedLinesForProduct
      description: Recent receipt lines without a product, ranked by similarity to this product.
      responses:
        "200":
          description: Lines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UnmatchedLine" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/lines/{id}/product:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: linkLineProduct
      description: >
        Set or clear (product_id null) a line's product. With remember (default true) the
        line text at this shop becomes an alias: other unmatched lines with the same text are
        linked now, and future receipts link automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkInput" }
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkResult" }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Check" }

    Check:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        detail: { type: string }

    Version:
      type: object
      required: [version, commit, schema_version]
      properties:
        version: { type: string }
        commit: { type: string }
        schema_version: { type: integer, format: int64 }

    ShopInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        chain: { type: string }
        branch: { type: string }
        address: { type: string }
        city: { type: string }
        notes: { type: string }

    Shop:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        chain: { type: string }
        branch: { type: string }
        address: { type: string }
        city: { type: string }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        sort: { type: integer }

    Category:
      type: object
      required: [id, name, sort]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sort: { type: integer }

    ReceiptStatus:
      type: string
      enum: [pending, processing, needs_review, ok, failed]

    LineKind:
      type: string
      enum: [item, discount, deposit, bag, other]

    LineUnit:
      type: string
      enum: [pc, kg, l]

    LineInput:
      type: object
      required: [raw_text, kind, line_total_cents]
      properties:
        raw_text: { type: string }
        kind: { $ref: "#/components/schemas/LineKind" }
        qty: { type: number, format: double, default: 1 }
        unit: { $ref: "#/components/schemas/LineUnit" }
        unit_price_cents: { type: integer, format: int64 }
        line_total_cents: { type: integer, format: int64 }
        vat_code: { type: string }
        parent_line_id: { type: integer, format: int64 }

    ReceiptLine:
      type: object
      required: [id, receipt_id, line_no, raw_text, kind, qty, unit, line_total_cents, user_edited]
      properties:
        id: { type: integer, format: int64 }
        receipt_id: { type: integer, format: int64 }
        line_no: { type: integer }
        raw_text: { type: string }
        kind: { $ref: "#/components/schemas/LineKind" }
        qty: { type: number, format: double }
        unit: { $ref: "#/components/schemas/LineUnit" }
        unit_price_cents: { type: integer, format: int64 }
        line_total_cents: { type: integer, format: int64 }
        vat_code: { type: string }
        parent_line_id: { type: integer, format: int64 }
        product_id: { type: integer, format: int64 }
        user_edited: { type: boolean }
        suggestions:
          type: array
          description: Up to 3 likely products for unmatched item lines (single-receipt GET only).
          items: { $ref: "#/components/schemas/ProductMatch" }

    ReceiptPatch:
      type: object
      description: Only the fields present are changed.
      properties:
        shop_id: { type: integer, format: int64 }
        purchased_at: { type: string, format: date-time }
        total_cents: { type: integer, format: int64 }

    Receipt:
      type: object
      required: [id, shop_id, status, review_reasons, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        shop_id: { type: integer, format: int64 }
        purchased_at: { type: string, format: date-time }
        total_cents: { type: integer, format: int64 }
        parsed_sum_cents: { type: integer, format: int64 }
        payment_method: { type: string }
        status: { $ref: "#/components/schemas/ReceiptStatus" }
        review_reasons:
          type: array
          items: { type: string, enum: [no_total, total_mismatch, line_math, no_date, low_conf, unparsed_rows] }
        ocr_engine: { type: string }
        ocr_ms: { type: integer, format: int64 }
        parser_version: { type: integer }
        confirmed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ReceiptLine" }

    ReceiptPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Receipt" }
        next_cursor: { type: string }

    Nutrition:
      type: object
      description: Values per 100 g / 100 ml.
      properties:
        per: { type: string, enum: ["100g", "100ml"], default: "100g" }
        energy_kcal: { type: number, format: double }
        fat: { type: number, format: double }
        saturated_fat: { type: number, format: double }
        carbs: { type: number, format: double }
        sugars: { type: number, format: double }
        fibre: { type: number, format: double }
        protein: { type: number, format: double }
        salt: { type: number, format: double }
        source: { type: string, enum: [openfoodfacts, manual], default: manual }

    ProductInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        brand: { type: string }
        category_id: { type: integer, format: int64 }
        barcode: { type: string }
        net_quantity: { type: number, format: double, description: "package size, with net_unit" }
        net_unit: { type: string, enum: [g, ml, pc] }
        openfoodfacts_code: { type: string }
        image_url: { type: string, description: "https Open Food Facts image to download (create only)" }
        nutrition: { $ref: "#/components/schemas/Nutrition" }

    Product:
      type: object
      required: [id, name, has_image, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        brand: { type: string }
        category_id: { type: integer, format: int64 }
        barcode: { type: string }
        net_quantity: { type: number, format: double }
        net_unit: { type: string, enum: [g, ml, pc] }
        openfoodfacts_code: { type: string }
        has_image: { type: boolean }
        nutrition: { $ref: "#/components/schemas/Nutrition" }
        score: { type: number, format: double, description: "search relevance, only with q" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OpenFoodFactsPrefill:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        brand: { type: string }
        net_quantity: { type: number, format: double }
        net_unit: { type: string, enum: [g, ml] }
        image_url: { type: string }
        nutrition: { $ref: "#/components/schemas/Nutrition" }

    BarcodeLookup:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [local, openfoodfacts] }
        product: { $ref: "#/components/schemas/Product" }
        prefill: { $ref: "#/components/schemas/OpenFoodFactsPrefill" }

    ProductMatch:
      type: object
      required: [product_id, name, score]
      properties:
        product_id: { type: integer, format: int64 }
        name: { type: string }
        brand: { type: string }
        score: { type: number, format: double }

    Alias:
      type: object
      required: [id, text, product_id, created_at]
      properties:
        id: { type: integer, format: int64 }
        text: { type: string, description: normalised receipt text }
        shop_id: { type: integer, format: int64 }
        shop_name: { type: string }
        product_id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    UnmatchedLine:
      type: object
      required: [line, shop_id, shop_name, score]
      properties:
        line: { $ref: "#/components/schemas/ReceiptLine" }
        shop_id: { type: integer, format: int64 }
        shop_name: { type: string }
        purchased_at: { type: string, format: date-time }
        score: { type: number, format: double }

    LinkInput:
      type: object
      properties:
        product_id: { type: integer, format: int64, nullable: true }
