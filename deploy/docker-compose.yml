name: shop

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  api:
    image: shop-api:latest
    build:
      context: ../api
      args:
        VERSION: ${SHOP_VERSION:-dev}
        COMMIT: ${SHOP_COMMIT:-none}
    restart: unless-stopped
    ports: ["${SHOP_PORT:-8080}:8080"]
    volumes: ["shop-data:/data"]
    environment:
      SHOP_DATA_DIR: /data
      OCR_URL: ${OCR_URL:-http://ocr:8000}
      OCR_FALLBACK_URL: ${OCR_FALLBACK_URL:-}
      OFF_USER_AGENT: "Shop/0.1 (self-hosted)"
      SHOP_TZ: Europe/Amsterdam
      LOGO_DEV_TOKEN: ${LOGO_DEV_TOKEN:-}   # from deploy/.env (git-ignored)
      AUTO_PRODUCTS: ${AUTO_PRODUCTS:-on}   # on (default): confirming a receipt links/creates products (docs/PRODUCT-AUTOPOPULATE.md)
    depends_on:
      ocr:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/shop", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    logging: *logging

  ocr:
    image: shop-ocr:ppocrv5
    build:
      context: ../ocr
      args:
        OCR_ENGINE: ppocrv5
    restart: unless-stopped
    mem_limit: 3g
    logging: *logging

  # Nightly snapshot of the database + image mirror into a folder.
  # SHOP_BACKUP_DIR is the host path of that folder: a plain local folder (default ../backups),
  # an external disk or a network mount. Use any of them; none is required.
  backup:
    image: shop-api:latest
    command: ["backup", "-schedule"]
    restart: unless-stopped
    volumes:
      - "shop-data:/data"
      - "${SHOP_BACKUP_DIR:-../backups}:/backup"
    environment:
      SHOP_DATA_DIR: /data
      SHOP_TZ: Europe/Amsterdam
      BACKUP_DIR: /backup
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    depends_on:
      api:
        condition: service_started
    logging: *logging

  # OPTIONAL off-site copy of the backup folder with rclone. Not started by default:
  #   docker compose -f deploy/docker-compose.yml --profile offsite up -d offsite
  # (or `make offsite-up`). rclone reaches S3-compatible stores, Backblaze B2, SFTP, WebDAV,
  # Google Drive, Dropbox or a folder/NAS, configured only by OFFSITE_REMOTE plus either a
  # rclone.conf in deploy/offsite/config/ or RCLONE_CONFIG_* variables in
  # deploy/offsite/offsite.env (both git-ignored). See docs/operations.md.
  # Without this profile nothing changes: backups stay in SHOP_BACKUP_DIR.
  offsite:
    profiles: ["offsite"]
    image: rclone/rclone:1.68.2
    entrypoint: ["sh", "/offsite.sh"]
    command: ["loop"]
    restart: unless-stopped
    volumes:
      - "./offsite/offsite.sh:/offsite.sh:ro"
      - "shop-data:/data"                                  # only to write offsite_status.json for /healthz
      - "${SHOP_BACKUP_DIR:-../backups}:/backup"           # read by the copy; written only by `pull`
      - "${OFFSITE_RCLONE_DIR:-./offsite/config}:/config/rclone"   # optional rclone.conf
    env_file:
      - path: ./offsite/offsite.env       # RCLONE_CONFIG_* secrets, optional
        required: false
    environment:
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-}
      OFFSITE_LABEL: ${OFFSITE_LABEL:-}
      OFFSITE_PRUNE: ${OFFSITE_PRUNE:-on}
      OFFSITE_RCLONE_FLAGS: ${OFFSITE_RCLONE_FLAGS:-}
      OFFSITE_RETRY_MINUTES: ${OFFSITE_RETRY_MINUTES:-30}
    logging: *logging

volumes:
  shop-data: {}
