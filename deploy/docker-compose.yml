name: shop

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  api:
    image: shop-api:latest
    build:
      context: ../api
      args:
        VERSION: ${SHOP_VERSION:-dev}
        COMMIT: ${SHOP_COMMIT:-none}
    restart: unless-stopped
    ports: ["${SHOP_PORT:-8080}:8080"]
    volumes: ["shop-data:/data"]
    environment:
      SHOP_DATA_DIR: /data
      OCR_URL: ${OCR_URL:-http://ocr:8000}
      OCR_FALLBACK_URL: ${OCR_FALLBACK_URL:-}
      OFF_USER_AGENT: "Shop/0.1 (self-hosted)"
      SHOP_TZ: Europe/Amsterdam
      LOGO_DEV_TOKEN: ${LOGO_DEV_TOKEN:-}   # from deploy/.env (git-ignored)
    depends_on:
      ocr:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/shop", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    logging: *logging

  ocr:
    image: shop-ocr:ppocrv5
    build:
      context: ../ocr
      args:
        OCR_ENGINE: ppocrv5
    restart: unless-stopped
    mem_limit: 3g
    logging: *logging

  # Nightly snapshot of the database + image mirror to the NAS.
  # SHOP_BACKUP_DIR is the host path of the NAS mount, e.g. /Volumes/nas/shop.
  backup:
    image: shop-api:latest
    command: ["backup", "-schedule"]
    restart: unless-stopped
    volumes:
      - "shop-data:/data"
      - "${SHOP_BACKUP_DIR:-../backups}:/backup"
    environment:
      SHOP_DATA_DIR: /data
      SHOP_TZ: Europe/Amsterdam
      BACKUP_DIR: /backup
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    depends_on:
      api:
        condition: service_started
    logging: *logging

volumes:
  shop-data: {}
