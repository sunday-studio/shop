name: pantry

services:
  api:
    image: pantry-api:latest
    build:
      context: ../api
      args:
        VERSION: ${PANTRY_VERSION:-dev}
        COMMIT: ${PANTRY_COMMIT:-none}
    restart: unless-stopped
    ports: ["${PANTRY_PORT:-8080}:8080"]
    volumes: ["pantry-data:/data"]
    environment:
      PANTRY_DATA_DIR: /data
      OCR_URL: http://ocr:8000
      OCR_FALLBACK_URL: ${OCR_FALLBACK_URL:-}
      OFF_USER_AGENT: "Pantry/0.1 (self-hosted)"
      PANTRY_TZ: Europe/Amsterdam
    depends_on:
      ocr:
        condition: service_started

  ocr:
    image: pantry-ocr:ppocrv5
    build:
      context: ../ocr
      args:
        OCR_ENGINE: ppocrv5
    restart: unless-stopped
    mem_limit: 3g

volumes:
  pantry-data: {}
