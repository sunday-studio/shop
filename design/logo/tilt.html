:root{--ink:#1D1D1B;--ink2:#73736F;--ink3:#B4B4AF;--bg:#FFFFFF;--sunk:#F4F4F3;--line:#F0F0EE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 'GT America',-apple-system,system-ui,sans-serif}
header{padding:40px 32px 8px}
h1{font-size:28px;font-weight:700;letter-spacing:-0.04em;margin:0 0 6px}
header p{margin:0;color:var(--ink2);font-size:12.5px;max-width:640px}
section{padding:28px 32px;border-top:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:16px}
.name{font-size:19px;font-weight:700;letter-spacing:-0.02em}
.name small{display:block;font-weight:400;font-size:12.5px;color:var(--ink2);letter-spacing:0;margin-top:2px}
.lockups{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lock{display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:20px}
.lock.l{background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.lock.d{background:#0C0C0B;color:#F4F4F1}
.word{font-weight:700;font-size:40px;letter-spacing:-0.04em;line-height:1}
.word.s{font-size:56px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.panels{grid-template-columns:1fr}}
.panel{border-radius:28px;padding:24px;overflow:auto;max-height:290px}
.panel.light{background:linear-gradient(160deg,#EAF2FF 0%,#F7ECF7 55%,#FFF3E4 100%)}
.panel.dark{background:linear-gradient(160deg,#16181F 0%,#0C0C0B 60%,#1A1424 100%)}
.row{display:flex;align-items:flex-start;gap:28px;width:max-content}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.cell label{font:500 11px/1 'GT America Mono','GT America',monospace;color:var(--ink2)}
.dark .cell label{color:#8F8F8A}
.ic{display:block;flex:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-image:var(--squircle);mask-image:var(--squircle)}
.ic img{display:block;width:100%;height:100%}
</style>
</head>

<header>
  <h1>Receipt: tilted on the grain background</h1>
  <p>Round 4: the grain and thermal-line background with the receipt skewed to the side. Four angles and crops.</p>
</header>
<main id="main"></main>

const dirs=[
 ['receipt3-a-tilt-9.svg','A Tilt -9, bleed','The strip you picked: -9 degrees, running off the top. Header with green dot, tear line, barcode.'],
 ['receipt3-b-tilt-16.svg','B Tilt -16, bleed','Stronger lean, shifted right.'],
 ['receipt3-c-tilt-plus-12.svg','C Tilt +12, bleed','Leans the other way, shifted left.'],
 ['receipt3-d-contained.svg','D Tilt -10, contained','Whole receipt visible, teeth included, no cropping.']
];
// superellipse approximation of the iOS app-icon shape, as a data-URI mask
(function(){
  const n=5,N=120,pts=[];
  for(let i=0;i<N;i++){const t=i/N*2*Math.PI,c=Math.cos(t),s=Math.sin(t);
    const x=50+50*Math.sign(c)*Math.pow(Math.abs(c),2/n),y=50+50*Math.sign(s)*Math.pow(Math.abs(s),2/n);
    pts.push(x.toFixed(2)+','+y.toFixed(2));}
  const svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='"+pts.join(' ')+"'/></svg>";
  document.documentElement.style.setProperty('--squircle','url("data:image/svg+xml,'+encodeURIComponent(svg)+'")');
})();
const sizes=[29,60,120,180,1024];
const icon=(src,px)=>`<div class="ic" style="width:${px}px;height:${px}px"><img src="${ICONS[src]||src}" alt=""></div>`;
const panel=(src,mode)=>`<div class="panel ${mode}"><div class="row">${sizes.map(s=>`<div class="cell">${icon(src,s)}<label>${s}</label></div>`).join('')}</div></div>`;
document.getElementById('main').innerHTML=dirs.map(([src,name,desc])=>`
<section>
  <div class="head">
    <div class="name">${name}<small>${desc}</small></div>
    <div class="lockups">
      <div class="lock l">${icon(src,56)}<span class="word">Shop</span></div>
      <div class="lock d">${icon(src,56)}<span class="word">Shop</span></div>
      <div class="lock l">${icon(src,56)}<span class="word s">S</span></div>
    </div>
  </div>
  <div class="panels">${panel(src,'light')}${panel(src,'dark')}</div>
</section>`).join('');
</script>
