openapi: 3.0.3
info:
  title: Shop API
  version: 0.16.0
  description: >
    Self-hosted grocery receipt tracker. Money is always integer cents.
    Timestamps are RFC3339 UTC. Errors use application/problem+json (RFC 7807).
    All /v1 routes need `Authorization: Bearer <token>`, except /v1/auth/status and /v1/auth/pair.
    Apps get a token by pairing with the server password (POST /v1/auth/pair) and unpair with DELETE /v1/auth/devices/{id}; scripts/assistants use `shop token create`.
servers:
  - url: http://localhost:8080
security:
  - bearer: []

paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: All dependencies healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: One or more dependencies unhealthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /version:
    get:
      operationId: getVersion
      security: []
      responses:
        "200":
          description: Build info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

  # ---------------------------------------------------------------- shops
  /v1/shops:
    get:
      operationId: listShops
      responses:
        "200":
          description: Shops (excluding deleted)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Shop" }
    post:
      operationId: createShop
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/shops/{id}/logo:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getShopLogo
      description: >
        The shop's logo (PNG, 128 px), fetched once from logo.dev by the server and cached on disk.
        404 when the shop has no domain, logos are not configured, or logo.dev has none; use a monogram then.
      responses:
        "200":
          description: Logo
          content:
            image/png: { schema: { type: string, format: binary } }
        default: { $ref: "#/components/responses/Problem" }

  /v1/shops/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getShop
      responses:
        "200":
          description: Shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateShop
      description: Replaces all editable fields (send the full shop).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteShop
      responses:
        "204": { description: Soft-deleted }
        default: { $ref: "#/components/responses/Problem" }

  # ----------------------------------------------------------- categories
  /v1/categories:
    get:
      operationId: listCategories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCategory
      description: "Deleting a category that has products needs move_to: a category id, or 0 for no category."
      parameters:
        - { name: move_to, in: query, schema: { type: integer, format: int64, minimum: 0 }, description: "where the products go; 0 = no category" }
      responses:
        "204": { description: Deleted (products moved first, in one transaction) }
        "409": { description: "The category has products and move_to was not given: nothing is deleted. Problem with code category_has_products and product_count." , content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        default: { $ref: "#/components/responses/Problem" }

  # ------------------------------------------------------------- receipts
  /v1/receipts:
    get:
      operationId: listReceipts
      parameters:
        - { name: from, in: query, description: "inclusive, YYYY-MM-DD (local)", schema: { type: string, format: date } }
        - { name: to, in: query, description: "inclusive, YYYY-MM-DD (local)", schema: { type: string, format: date } }
        - { name: shop_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ReceiptStatus" } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Page of receipts, newest first (without lines)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: uploadReceipt
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: "JPEG or PNG, max 20 MB" }
                shop_id: { type: integer, format: int64, description: "optional: without it the receipt is unassigned until a shop is chosen or suggested" }
                purchased_at: { type: string, format: date-time, description: "overrides the date read from the receipt" }
                photo_taken_at: { type: string, format: date-time, description: "hint only (photo EXIF); stored, never used as purchased_at" }
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "409":
          description: Same image already uploaded; body holds the existing receipt id in `detail`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "415":
          description: Not a JPEG or PNG. HEIC/HEIF is rejected explicitly (convert to JPEG on the device first); `detail` says which
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/counts:
    get:
      operationId: receiptCounts
      description: Receipts per status, for the home attention card and tab badge.
      responses:
        "200":
          description: Counts (every status present, 0 when none)
          content:
            application/json:
              schema:
                type: object
                required: [pending, processing, needs_review, ok, failed, total]
                properties:
                  pending: { type: integer }
                  processing: { type: integer }
                  needs_review: { type: integer }
                  ok: { type: integer }
                  failed: { type: integer }
                  total: { type: integer }

  /v1/receipts/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getReceipt
      responses:
        "200":
          description: Receipt with lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiptPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteReceipt
      responses:
        "204": { description: Deleted (image file too) }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}/shop-suggestion:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getShopSuggestion
      description: |
        Reads the receipt header (chain name + street/number/town) and suggests a shop: an existing one
        or a new one to create. `suggestion` is null when nothing safe can be said (cropped slips, unreadable
        header, already on the right shop, or rejected before). Supermarket-style receipts only.
      responses:
        "200":
          description: The suggestion (or null)
          content:
            application/json:
              schema:
                type: object
                required: [receipt_id, suggestion]
                properties:
                  receipt_id: { type: integer, format: int64 }
                  suggestion:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/ShopSuggestion" }]
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}/shop-suggestion/accept:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: acceptShopSuggestion
      description: |
        Puts the receipt on the suggested shop. With `shop_id` it uses that existing shop; otherwise it
        creates a new shop called `name` (default: the suggested name) from the suggested chain and branch.
        With `apply_to_waiting` (default true) every other unconfirmed receipt from the same branch is moved
        to that shop too. Confirmed receipts are never touched.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                shop_id: { type: integer, format: int64 }
                name: { type: string, description: "name for the new shop; the user may edit the suggestion" }
                branch: { type: string, description: "overrides the suggested branch of the new shop" }
                domain: { type: string, description: "overrides the guessed logo domain of the new shop (e.g. ah.nl)" }
                apply_to_waiting: { type: boolean, default: true }
      responses:
        "200":
          description: The shop and the receipts that were moved onto it (this one included)
          content:
            application/json:
              schema:
                type: object
                required: [shop, linked_receipt_ids]
                properties:
                  shop: { $ref: "#/components/schemas/Shop" }
                  linked_receipt_ids: { type: array, items: { type: integer, format: int64 } }
        "409":
          description: The receipt is confirmed
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}/shop-suggestion/reject:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: rejectShopSuggestion
      description: Remembers the branch so this suggestion is not offered again.
      responses:
        "204": { description: Remembered }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}/image:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getReceiptImage
      responses:
        "200":
          description: Original image
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: confirmReceipt
      responses:
        "200":
          description: Marked ok by the user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}/reparse:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: force, in: query, description: "discard user edits", schema: { type: boolean, default: false } }
    post:
      operationId: reparseReceipt
      description: Re-runs the parser on stored OCR output. Refused (409) for confirmed or user-edited receipts unless force=true.
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}/reocr:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: force, in: query, schema: { type: boolean, default: false } }
    post:
      operationId: reocrReceipt
      description: Runs OCR again, then parses. Same edit protection as reparse.
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}/lines:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: createLine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptLine" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/lines/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateLine
      description: Replaces the line's editable fields and marks it user-edited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptLine" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteLine
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }

  # ------------------------------------------------------------- products
  /v1/products:
    get:
      operationId: listProducts
      description: Without q, products sorted by name. With q, fuzzy-ranked (score >= 0.5).
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: integer, format: int64 } }
        - { name: sort, in: query, description: "without q: name (default), recent (last bought first) or purchases (most bought first)", schema: { type: string, enum: [name, recent, purchases] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "409":
          description: Barcode already used
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/barcodes/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string, pattern: "^[0-9]{8}$|^[0-9]{12,14}$" } }
    get:
      operationId: lookupBarcode
      description: Local product if known, else an Open Food Facts prefill (not saved). 404 if neither.
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BarcodeLookup" }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- automatic products
  /v1/barcodes/{code}/product:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string, pattern: "^[0-9]{8}$|^[0-9]{12,14}$" } }
    post:
      operationId: createBarcodeProduct
      description: |
        Scan creates the product. Known barcode: 200 `known` (no changes). Unknown: the product is created from
        Open Food Facts (201 `created`), or as a minimal placeholder when OFF has nothing or is unreachable
        (201 `created_minimal`, flagged for review; an unreachable OFF queues a retry on the server). Idempotent:
        a repeat is 200 `known` with `created_now: false`. Open Food Facts failures never fail the request.
      responses:
        "200":
          description: Already known
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BarcodeCreateResult" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BarcodeCreateResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/review-queue:
    get:
      operationId: getReviewQueue
      description: |
        Auto-created products waiting for a decision, ordered by reason (near_match, barcode_name_match,
        odd_name, no_category, barcode_minimal, barcode_off_unavailable), newest first. `limit=0` returns only
        `total` and `counts` (a cheap count for the catalog badge).
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 0, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: reason, in: query, schema: { $ref: "#/components/schemas/ReviewReason" } }
      responses:
        "200":
          description: The queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueue" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/autopopulate/backfill:
    get:
      operationId: getBackfill
      responses:
        "200":
          description: State of the last or current backfill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackfillState" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: startBackfill
      description: Links or creates products for receipts already confirmed (oldest first). 409 when AUTO_PRODUCTS is off or one is running.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: { type: boolean, default: false, description: "count without writing" }
                skip_receipt_ids: { type: array, items: { type: integer, format: int64 }, description: "receipts to leave out (e.g. one that still needs fixing)" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: integer, format: int64 }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/{id}/review:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: reviewProduct
      description: |
        Decide a product in the queue. `merge`: for near_match the card's product disappears into the suggestion;
        for barcode_name_match the card's (barcode) product survives and the suggested product is moved into it.
        The response `product` is always the survivor. `accept` takes `category_id` and `name` together
        (a chosen category becomes category_source=manual). 409 when the product is no longer in the queue,
        422 when discarding a manual product.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: mergeProduct
      description: |
        `{id}` disappears into `into_product_id`: lines and aliases move over, empty fields of the survivor are
        filled, `{id}` is soft-deleted. Reversible for 30 days with the returned merge_id. 409 (title "These two
        have different barcodes.") when both have different barcodes, 422 when id == into. The survivor is returned as `product`, with `merged_away`, `lines_moved` and `aliases_moved` for a toast. What the source gives the survivor: its barcode, brand, photo, size, OFF code and category when the survivor has none, and its nutrition when the survivor has none; the survivor keeps its own name and any English name the user typed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [into_product_id]
              properties:
                into_product_id: { type: integer, format: int64 }
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MergeResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: restoreProduct
      description: Undo of a manual product delete, within 30 days (for an Undo toast). The barcode comes back if nobody else took it. 409 if the product is not deleted, was merged (undo the merge instead) or is older than 30 days.
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/{id}/refresh:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: refreshProduct
      description: Retry Open Food Facts now for a product with a barcode. Fills only empty fields; a name the user typed is kept. 422 without a barcode.
      responses:
        "200":
          description: Refreshed (or OFF still unavailable)
          content:
            application/json:
              schema:
                type: object
                required: [product, off_status]
                properties:
                  product: { $ref: "#/components/schemas/Product" }
                  off_status: { type: string, enum: [found, not_found, unavailable] }
        default: { $ref: "#/components/responses/Problem" }

  /v1/product-merges/{id}/undo:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: undoProductMerge
      description: |
        Reverses a merge, discard or split exactly (lines, aliases, copied fields, review state) within 30 days.
        Lines relinked since are left alone and counted in `lines_skipped`. 409 if already undone or older than 30 days.
      responses:
        "200":
          description: Undone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UndoResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/lines/{id}/split-product:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: splitLineProduct
      description: Gives this line (and lines with the same shop and text) a new product of its own. Undo with the returned merge_id. 404 if the line has no product, 422 if it is not an item.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "201":
          description: Split
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SplitResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getProduct
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateProduct
      description: Replaces editable fields (send the full product). Nutrition only changes when present.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteProduct
      responses:
        "204": { description: Soft-deleted (barcode released) }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/{id}/image:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getProductImage
      responses:
        "200":
          description: JPEG, max 1024 px
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putProductImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/{id}/nutrition:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: putNutrition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Nutrition" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteNutrition
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/{id}/aliases:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listAliases
      responses:
        "200":
          description: Receipt texts linked to this product
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alias" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/aliases/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: deleteAlias
      responses:
        "204": { description: Deleted (already-linked lines keep their product) }
        default: { $ref: "#/components/responses/Problem" }

  /v1/products/{id}/unmatched-lines:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: days, in: query, schema: { type: integer, default: 14, maximum: 365 } }
    get:
      operationId: unmatchedLinesForProduct
      description: Recent receipt lines without a product, ranked by similarity to this product.
      responses:
        "200":
          description: Lines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UnmatchedLine" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/lines/{id}/product:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: linkLineProduct
      description: >
        Set or clear (product_id null) a line's product. With remember (default true) the
        line text at this shop becomes an alias: other unmatched lines with the same text are
        linked now, and future receipts link automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkInput" }
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkResult" }
        default: { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- stats
  /v1/stats/spend:
    get:
      operationId: getSpend
      description: >
        Spend over receipts with status ok or needs_review. from/to are inclusive local dates
        (default: the last 30 days). Time groupings include empty periods.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: group_by, in: query, schema: { type: string, enum: [day, week, month, shop, category, product], default: month } }
        - { name: split_by, in: query, description: "with a time group_by: category or shop; each bucket carries split[] and its cents is their sum", schema: { type: string, enum: [category, shop] } }
        - { name: category_id, in: query, description: "group_by=product only", schema: { type: integer, format: int64 } }
        - { name: shop_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Spend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Spend" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/stats/products/{id}/prices:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: shop_id, in: query, schema: { type: integer, format: int64 } }
    get:
      operationId: getPriceHistory
      description: Every purchase of the product on ok receipts, oldest first, with price per base unit.
      responses:
        "200":
          description: Price points
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PricePoint" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/stats/products/{id}/compare:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: comparePrices
      responses:
        "200":
          description: Per-shop prices, cheapest latest price first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShopPrice" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/stats/price-changes:
    get:
      operationId: getPriceChanges
      parameters:
        - { name: since, in: query, description: "local date; default 90 days ago", schema: { type: string, format: date } }
        - { name: min_pct, in: query, schema: { type: number, format: double, default: 5 } }
      responses:
        "200":
          description: Biggest changes first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PriceChange" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/stats/frequent-items:
    get:
      operationId: getFrequentItems
      parameters:
        - { name: lookback_days, in: query, schema: { type: integer, default: 180, maximum: 730 } }
        - { name: min_count, in: query, schema: { type: integer, default: 3 } }
      responses:
        "200":
          description: Frequently bought products; due ones first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FrequentItem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/receipts/{id}/list-checks/undo:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: undoReceiptListChecks
      description: >
        Undo what confirming this receipt did to the shopping list: items it checked are unchecked and items it
        reduced get their quantity and note back. Items the user changed since are left alone. The receipt will
        not touch those items again. Undoing twice restores nothing the second time (200 with an empty list).
        The restored items also arrive through /v1/list/changes.
      responses:
        "200":
          description: Items put back
          content:
            application/json:
              schema:
                type: object
                required: [restored]
                properties:
                  restored: { type: array, items: { $ref: "#/components/schemas/ListItem" } }
        default: { $ref: "#/components/responses/Problem" }

  # ----------------------------------------------------------------- list
  /v1/list:
    get:
      operationId: getShoppingList
      description: >
        The main list and the items of every checklist (each has `group_id` when it is in a group). Template items
        are not included. The `X-List-Rev` header is the current rev, usable as `since_rev` for
        GET /v1/list/changes. To get groups too, use GET /v1/list/changes?since_rev=0.
      parameters:
        - { name: include_checked, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Items (open first)
          headers:
            X-List-Rev: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ListItem" }
    post:
      operationId: addListItem
      parameters:
        - name: Idempotency-Key
          in: header
          description: Same as client_id in the body (either works).
          schema: { type: string, maxLength: 100 }
      description: >
        Free text is linked to a product automatically when it matches one closely (score >= 0.9).
        Adding a product that is already open in the same group (or on the main list when there is no group_id)
        increases its qty instead (200). With group_id the item goes into that group (404 if it does not exist).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListItemInput" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListItem" }
        "200":
          description: Merged into an existing open item, or a repeat of an earlier request with the same client_id (returned unchanged)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListItem" }
        "410":
          description: Repeat of a client_id whose item has since been deleted
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/list/changes:
    get:
      operationId: listChanges
      description: >
        Offline sync. Two cursors, pick one per call.


        **since_rev (preferred).** Every list write (item, group or deletion) gets the next number of one global
        counter, the `rev`. Send the `rev` of your last response as `since_rev` and get exactly what was written
        after it: items (checked ones included), groups (any kind, archived too) and the ids deleted. Nothing is
        repeated and nothing can be missed. `since_rev=0` returns the complete list. When `full_resync` is true the
        response is the complete list (not a delta) and the phone replaces its local copy; this happens for
        `since_rev=0` and when the phone has been away longer than deletions are remembered (30 days). A
        `since_rev` ahead of the server answers 400: start again from 0.


        **since (original, still works).** Items and groups created, edited, checked or unchecked at or after
        `since`, plus ids deleted since. Pass the returned server_time as the next `since`. The boundary is
        inclusive, so something can come back twice; applying it again is harmless. For a `since` older than 30
        days `full_resync` is true and the app should refetch GET /v1/list?include_checked=true.
        The response also carries `rev`, so a phone can switch to since_rev after one call.


        Template items are never in `items` (read them with GET /v1/list/groups/{id}). Items of archived groups are.
        `other_group_ids` and `on_main_list` on items are computed when the response is built, so they can be
        out of date for items that did not change; a phone that needs them live derives them from product_id
        and group_id.
      parameters:
        - { name: since_rev, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time }, description: "Original cursor. One of since_rev or since is required; since_rev wins if both are sent." }
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema:
                type: object
                required: [items, deleted_ids, server_time, full_resync, rev, groups, deleted_group_ids]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ListItem" } }
                  deleted_ids: { type: array, items: { type: integer, format: int64 } }
                  groups: { type: array, items: { $ref: "#/components/schemas/ListGroup" }, description: "created or edited groups (without items; item_count and checked_count are as of this response)" }
                  deleted_group_ids: { type: array, items: { type: integer, format: int64 }, description: "groups deleted. Their items were moved to the main list (these arrive in `items`) or deleted (in `deleted_ids`)." }
                  rev: { type: integer, format: int64, description: "send as since_rev next time" }
                  server_time: { type: string, format: date-time }
                  full_resync: { type: boolean }
                  suggestions:
                    type: array
                    description: >
                      All open "Looks bought?" suggestions right now (not just new ones), so a phone can replace
                      its local copy each sync.
                    items: { $ref: "#/components/schemas/ListSuggestion" }
        default: { $ref: "#/components/responses/Problem" }

  # ----------------------------------------------------------------- list groups (checklists and templates)
  /v1/list/groups:
    get:
      operationId: listListGroups
      description: >
        Groups in display order (sort, then id), archived ones last and only with include_archived. Use kind=template
        for the template list (item_count tells how many items each has).
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [checklist, template] } }
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
        - { name: include_items, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Groups
          headers:
            X-List-Rev: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ListGroup" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createListGroup
      description: >
        Creates a group and all its items in one transaction (all or nothing). `items` is the ordered list of
        lines; the response lists `item_ids` in the same order (two lines for the same product share one id).
        Idempotent by `client_id` (or the Idempotency-Key header): a repeat, however often the phone retries,
        returns the group the first call made with 200 and the same item_ids, and never creates a second one;
        410 if that group has since been deleted. Assistants can use `external_ref` instead: a repeat with the same
        source and ref returns the existing group (200, items of the repeat ignored, item_ids empty).
        `kind` is checklist (default) or template.
      parameters:
        - name: Idempotency-Key
          in: header
          description: Same as client_id in the body (either works).
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListGroupInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListGroup" }
        "200":
          description: A repeat of an earlier request (same client_id or external_ref), returned as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListGroup" }
        "410":
          description: Repeat of a client_id whose group has since been deleted
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/list/groups/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getListGroup
      description: One group with its items (templates included).
      responses:
        "200":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListGroup" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateListGroup
      description: Rename, set the note, reorder (sort) or archive/unarchive a group. Only the fields sent change. Returns the group with its items.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListGroupPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListGroup" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteListGroup
      description: >
        Deletes the group. `items=keep` (default) moves its items to the main list; `items=delete` deletes them
        too. A template always deletes its items. Undo with POST /v1/list/groups/{id}/restore for 10 minutes.
        The group and any deleted items leave a tombstone for sync.
      parameters:
        - { name: items, in: query, schema: { type: string, enum: [keep, delete], default: keep } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListGroupDeleted" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/list/groups/{id}/items:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: addListGroupItems
      description: >
        Adds items to the group in one transaction. A line whose product is already open in this group raises
        that item's qty instead. Returns the items in request order (merged lines repeat the same item).
        Not idempotent by itself: for offline retries add one item at a time with POST /v1/list (group_id + client_id).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListGroupItemsInput" }
      responses:
        "200":
          description: The items
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ListItem" } }
        default: { $ref: "#/components/responses/Problem" }

  /v1/list/groups/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: restoreListGroup
      description: >
        Undo of DELETE within 10 minutes: the group returns with its old id, its deleted items are recreated with
        their old ids and kept items move back from the main list. Idempotent (a second call returns the group).
        404 if the group was never deleted, 410 after the 10 minutes.
      responses:
        "200":
          description: The group with its items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListGroup" }
        "410":
          description: Too late to undo
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/list/groups/{id}/instantiate:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: instantiateListTemplate
      description: >
        Starts a checklist from a template (400 if the group is not a template): a new checklist group with the
        same items, all unchecked. The name defaults to the template's. Idempotent by client_id like
        POST /v1/list/groups, with the same item_ids.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListGroupCopyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListGroup" }
        "200":
          description: A repeat of an earlier request (same client_id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListGroup" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/list/groups/{id}/save-as-template:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: saveListGroupAsTemplate
      description: Saves a checklist as a template (items unchecked, same order). 400 if the group is already a template. Idempotent by client_id.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListGroupCopyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListGroup" }
        "200":
          description: A repeat of an earlier request (same client_id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListGroup" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/list/suggestions:
    get:
      operationId: listSuggestions
      description: >
        Open "Looks bought?" suggestions: an open list item and the receipt line that probably is it
        (score 0.75 to 0.90, or a similar product of the same category). Never checked automatically.
      responses:
        "200":
          description: Open suggestions, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ListSuggestion" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/list/suggestions/{id}/accept:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: acceptListSuggestion
      description: >
        Checks the item off as bought on that receipt (check_source=receipt) and returns it. Idempotent: accepting
        twice returns the item again. 409 if the suggestion was dismissed. If the item is already checked it is
        returned unchanged.
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListItem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/list/suggestions/{id}/dismiss:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: dismissListSuggestion
      description: Hides the suggestion for good. Idempotent. 409 if it was already accepted.
      responses:
        "204": { description: Dismissed }
        default: { $ref: "#/components/responses/Problem" }

  /v1/list/checked:
    delete:
      operationId: clearCheckedItems
      responses:
        "200":
          description: Removed count
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: integer, format: int64 }

  /v1/list/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateListItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListItemInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListItem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteListItem
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }

  /v1/list/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: moveListItem
      description: >
        Moves an item into a group, or back to the main list with group_id null. If the target already has the same
        product open, the quantities are added, the moved item is deleted (tombstone) and the target item is
        returned. Moving into or out of a template is 400. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id]
              properties:
                group_id: { type: integer, format: int64, nullable: true, description: "target group, null = main list" }
      responses:
        "200":
          description: The item as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListItem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/list/{id}/check:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: checkListItem
      responses:
        "200":
          description: Checked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListItem" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/list/{id}/uncheck:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: uncheckListItem
      responses:
        "200":
          description: Unchecked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListItem" }
        default: { $ref: "#/components/responses/Problem" }

  # ----------------------------------------------------------------- cheapest store (phase C)
  /v1/list/plan:
    get:
      operationId: getListPlan
      description: |
        Splits the open list (main list and live checklists; checked, template and archived items are left out) by
        shop and says whether the extra stop is worth it. Never promises a saving it cannot back up.

        Prices: only receipts with status ok, a date and a shop, after the discounts linked to the line. Each price is
        per kg, per l or per piece (`basis`); a product without a pack size is compared per piece and says so
        (`pack_size_known=false`, `different_pack`). An item's price at a shop is the median of its last 3
        purchases there inside 90 days (30 for fresh produce); older purchases are ignored. Items linked to a
        product group are priced from every product of the group, so house-brand milk at two shops compares; prices
        in different base units are never mixed.

        Plan: the usual shop (most receipts in 90 days) alone, or with up to `max_stops - 1` of the next shops (4
        shops are considered). Savings are counted only on items with a price at the usual shop and at the shop
        they move to, minus `extra_stop_cents` per extra shop. `status` is `split` only when that is above 0 and at
        least 2 items are comparable; `one_shop_fine` when splitting does not pay (`split_saving_cents` is what the
        best split would save before its stops); `not_enough_data` when fewer than 2 items have prices at two shops.
        Items without a price stay with the usual shop and carry no estimate.

        `extra_stop_cents` and `max_stops` default to the saved settings (`/v1/list/plan/settings`); passing them here
        is a what-if and saves nothing. `computed_at` is stable for caching on the phone.
      parameters:
        - { name: extra_stop_cents, in: query, schema: { type: integer, minimum: 0, maximum: 2000 } }
        - { name: max_stops, in: query, schema: { type: integer, minimum: 1, maximum: 3 } }
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListPlan" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/list/plan/settings:
    get:
      operationId: getListPlanSettings
      description: Cost of an extra stop and the most shops a plan may use. Stored on the server so every phone and the assistant agree. Defaults 250 and 2.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListPlanSettings" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateListPlanSettings
      description: Changes the given fields. 400 outside 0..2000 cents or 1..3 stops.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListPlanSettingsPatch" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListPlanSettings" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/product-groups:
    get:
      operationId: listProductGroups
      description: Product groups ("same kind of item"), each with its products and the shops they were bought at.
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProductGroup" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: confirmProductGroup
      description: |
        The user says these products are the same kind of item. Products that already belong to groups pull those
        groups in, so everything ends up in one (the oldest keeps its id and, unless `name` is given, its name).
        Without a name the group is called after the first product that has an English name, else its name.
        Clears an earlier "not the same". Nothing is ever grouped without this call. Same as `/v1/product-groups/confirm`.
        Reversible with `/v1/product-group-ops/{op_id}/undo`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductGroupConfirm" }
      responses:
        "200":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductGroupResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/product-groups/confirm:
    post:
      operationId: confirmProductGroupPair
      description: Alias of POST /v1/product-groups ("Yes, same kind"), kept for the pair confirmation card.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductGroupConfirm" }
      responses:
        "200":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductGroupResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/product-groups/deny:
    post:
      operationId: denyProductGroupPair
      description: "\"No, not the same kind\": the pair is never suggested again. Undoable. 409 when both are already in one group."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_a_id, product_b_id]
              properties:
                product_a_id: { type: integer, format: int64 }
                product_b_id: { type: integer, format: int64 }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [op_id]
                properties:
                  op_id: { type: integer, format: int64 }
        default: { $ref: "#/components/responses/Problem" }

  /v1/product-groups/suggestions:
    get:
      operationId: listProductGroupSuggestions
      description: |
        Pairs of products that look like the same kind of item, best first (name score at least 0.80 after dropping
        store-brand words and pack sizes, same category and base unit, bought at different shops, not already
        together, not denied, not "keep separate" in the product review). Only questions: the server never groups
        anything by itself. `GET /v1/products/review-queue` carries the number as `same_kind_total`.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProductGroupSuggestion" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/product-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getProductGroup
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductGroup" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: renameProductGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductGroup" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteProductGroup
      description: Dissolves the group; its products stay. Undoable with the returned op_id.
      responses:
        "200":
          description: Dissolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductGroupResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/product-groups/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: mergeProductGroup
      description: "`{id}` disappears into `into_group_id`: its products move over. 400 when both are the same group. Undoable."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [into_group_id]
              properties:
                into_group_id: { type: integer, format: int64 }
      responses:
        "200":
          description: The surviving group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductGroupResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/product-groups/{id}/split:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: splitProductGroup
      description: |
        Takes products out of the group. A group left with fewer than two products is dissolved (`group` is then
        null, or the new group when `keep_together`). With `keep_together` (and at least two products, not all of
        them) the products that leave form a new group called `name` (default: the old name). Undoable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_ids]
              properties:
                product_ids: { type: array, items: { type: integer, format: int64 }, minItems: 1 }
                keep_together: { type: boolean }
                name: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductGroupResult" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/product-group-ops/{id}/undo:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: undoProductGroupOp
      description: Reverses a confirm, merge, split, delete or deny exactly, once, within 30 days (409 otherwise). `group` is the first group the change touched, if it exists again.
      responses:
        "200":
          description: Undone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductGroupResult" }
        default: { $ref: "#/components/responses/Problem" }

  # ----------------------------------------------------------------- auth
  /v1/auth/status:
    get:
      operationId: getAuthStatus
      security: []
      description: Lets the app confirm a URL is a Shop server and that pairing is set up.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [server, version, pairing_enabled]
                properties:
                  server: { type: string, enum: [shop] }
                  version: { type: string }
                  pairing_enabled: { type: boolean }

  /v1/auth/pair:
    post:
      operationId: pairDevice
      security: []
      description: >
        Exchange the server's pairing password for a device token (store it in the Keychain;
        the password itself should not be kept). 5 failures in 15 minutes lock the address out (429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, device_name]
              properties:
                password: { type: string }
                device_name: { type: string, maxLength: 60 }
      responses:
        "201":
          description: Paired
          content:
            application/json:
              schema:
                type: object
                required: [token, device]
                properties:
                  token: { type: string, description: "bearer token, st_…" }
                  device: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/auth/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: The token making the request
          content:
            application/json:
              schema:
                type: object
                required: [name, kind]
                properties:
                  name: { type: string }
                  kind: { type: string, enum: [device, manual] }

  /v1/auth/devices:
    get:
      operationId: listDevices
      responses:
        "200":
          description: Paired devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }

  /v1/auth/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: revokeDevice
      description: Unpair a device; its token stops working immediately. (Can be the caller itself.)
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Problem" }

  # --------------------------------------------------------------- search
  /v1/search:
    get:
      operationId: search
      description: >
        One search box for the app: products (Dutch or English names, fuzzy), learned receipt texts
        (aliases), and receipts whose item lines contain the text or are linked to a matched product.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, description: per section, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                type: object
                required: [products, aliases, receipts]
                properties:
                  products: { type: array, items: { $ref: "#/components/schemas/Product" } }
                  aliases:
                    type: array
                    items:
                      type: object
                      required: [text, product_id, product_name, score]
                      properties:
                        text: { type: string, description: "normalised receipt text, e.g. ah halfvol melk" }
                        product_id: { type: integer, format: int64 }
                        product_name: { type: string }
                        shop_id: { type: integer, format: int64 }
                        shop_name: { type: string }
                        score: { type: number, format: double }
                  receipts:
                    type: array
                    items:
                      type: object
                      required: [receipt, matched_lines]
                      properties:
                        receipt: { $ref: "#/components/schemas/Receipt" }
                        matched_lines: { type: array, items: { type: string }, description: "up to 3" }
        default: { $ref: "#/components/responses/Problem" }

  # ------------------------------------------------------ english names
  /v1/glossary:
    get:
      operationId: listGlossary
      description: Your taught words (folded keys), with how many products use each.
      responses:
        "200":
          description: Terms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GlossaryTerm" }

  /v1/glossary/preview:
    post:
      operationId: previewGlossaryTerm
      description: What teaching a word would change. Nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/GlossaryTermInput"
                - type: object
                  required: [dutch]
                  properties:
                    dutch: { type: string }
                    examples: { type: integer, default: 3, maximum: 20 }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                type: object
                required: [products_affected, examples]
                properties:
                  products_affected: { type: integer }
                  examples:
                    type: array
                    items:
                      type: object
                      required: [product_id, name, status_after]
                      properties:
                        product_id: { type: integer, format: int64 }
                        name: { type: string }
                        name_en_before: { type: string }
                        name_en_after: { type: string }
                        status_after: { $ref: "#/components/schemas/NameEnStatus" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/glossary/{dutch}:
    parameters:
      - { name: dutch, in: path, required: true, description: "one word; folded server-side", schema: { type: string } }
    put:
      operationId: teachWord
      description: >
        Save a word's English (or keep it as is) and re-translate every automatic product name.
        Undo = PUT `previous` back, or DELETE when `previous` is null.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlossaryTermInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [term, products_updated]
                properties:
                  term: { $ref: "#/components/schemas/GlossaryTerm" }
                  previous: { $ref: "#/components/schemas/GlossaryTermInput" }
                  products_updated: { type: integer }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: forgetWord
      responses:
        "200":
          description: Removed; names re-translated
          content:
            application/json:
              schema:
                type: object
                required: [products_updated]
                properties:
                  products_updated: { type: integer }
        default: { $ref: "#/components/responses/Problem" }

  /v1/translations/todo:
    get:
      operationId: translationTodo
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        "200":
          description: The "needs English" queue
          content:
            application/json:
              schema:
                type: object
                required: [totals, words, products]
                properties:
                  totals:
                    type: object
                    required: [words_left, products_left]
                    properties:
                      words_left: { type: integer }
                      products_left: { type: integer }
                  words:
                    type: array
                    items:
                      type: object
                      required: [word, key, products, lines, examples]
                      properties:
                        word: { type: string, description: display form }
                        key: { type: string, description: send this when teaching }
                        products: { type: integer }
                        lines: { type: integer, description: unmatched receipt lines (180 days) }
                        examples: { type: array, items: { type: string } }
                  products:
                    type: array
                    items:
                      type: object
                      required: [id, name, name_en_status, name_en_unknown]
                      properties:
                        id: { type: integer, format: int64 }
                        name: { type: string }
                        name_en: { type: string }
                        name_en_status: { $ref: "#/components/schemas/NameEnStatus" }
                        name_en_unknown: { type: array, items: { $ref: "#/components/schemas/Span" } }
                        shop_name: { type: string, description: shop of the latest purchase }
                        shop_chain: { type: string }

  /v1/translate:
    get:
      operationId: previewTranslation
      parameters:
        - { name: text, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Live preview for edit forms
          content:
            application/json:
              schema:
                type: object
                required: [status, unknown]
                properties:
                  english: { type: string, description: absent when status is missing }
                  status: { $ref: "#/components/schemas/NameEnStatus" }
                  unknown: { type: array, items: { $ref: "#/components/schemas/Span" } }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: "stable machine-readable reason, e.g. category_name_taken, category_has_products" }
        product_count: { type: integer, description: "category_has_products: how many products would be orphaned" }

    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Check" }

    Check:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        detail: { type: string }

    Version:
      type: object
      required: [version, commit, schema_version]
      properties:
        version: { type: string }
        commit: { type: string }
        schema_version: { type: integer, format: int64 }

    ShopInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        domain:
          type: string
          description: >
            Web domain for the logo, e.g. ah.nl. Omit to keep the current one (or have it guessed for
            known chains: Albert Heijn, Jumbo, Lidl, Aldi, Plus, Dirk, …); send "" to clear.
        chain: { type: string }
        branch: { type: string }
        address: { type: string }
        city: { type: string }
        notes: { type: string }

    Shop:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        chain: { type: string }
        branch: { type: string }
        address: { type: string }
        city: { type: string }
        notes: { type: string }
        domain: { type: string }
        logo_url: { type: string, description: "relative URL of the cached logo; absent when there is none" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, description: "trimmed; unique ignoring case (409 code category_name_taken)" }
        sort: { type: integer, deprecated: true, description: "accepted and ignored" }
        color: { $ref: "#/components/schemas/CategoryColor" }

    Category:
      type: object
      required: [id, name, sort, product_count]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        sort: { type: integer, deprecated: true, description: "always 0; categories are alphabetical. Kept so older app builds still decode." }
        color: { $ref: "#/components/schemas/CategoryColor" }
        product_count: { type: integer, description: "non-deleted products in the category" }

    CategoryColor:
      type: string
      enum: [blue, green, red, orange, yellow, cyan, purple, teal, pink, grey]

    ReceiptStatus:
      type: string
      enum: [pending, processing, needs_review, ok, failed]

    LineKind:
      type: string
      enum: [item, discount, deposit, bag, other]

    LineUnit:
      type: string
      enum: [pc, kg, l]

    LineInput:
      type: object
      required: [raw_text, kind, line_total_cents]
      properties:
        raw_text: { type: string }
        kind: { $ref: "#/components/schemas/LineKind" }
        qty: { type: number, format: double, default: 1 }
        unit: { $ref: "#/components/schemas/LineUnit" }
        unit_price_cents: { type: integer, format: int64 }
        line_total_cents: { type: integer, format: int64 }
        vat_code: { type: string }
        parent_line_id: { type: integer, format: int64 }

    ReceiptLine:
      type: object
      required: [id, receipt_id, line_no, raw_text, kind, qty, unit, line_total_cents, user_edited]
      properties:
        id: { type: integer, format: int64 }
        receipt_id: { type: integer, format: int64 }
        line_no: { type: integer }
        raw_text: { type: string }
        kind: { $ref: "#/components/schemas/LineKind" }
        qty: { type: number, format: double }
        unit: { $ref: "#/components/schemas/LineUnit" }
        unit_price_cents: { type: integer, format: int64 }
        line_total_cents: { type: integer, format: int64 }
        vat_code: { type: string }
        parent_line_id: { type: integer, format: int64 }
        product_id: { type: integer, format: int64 }
        product_name: { type: string, description: "linked product (single-receipt GET)" }
        product_name_en: { type: string }
        category_id: { type: integer, format: int64, description: "linked product's category" }
        user_edited: { type: boolean }
        text_en: { type: string, description: "dictionary English rendering of raw_text, when good enough" }
        text_en_status: { type: string, enum: [dictionary, partial, missing] }
        text_en_unknown: { type: array, items: { $ref: "#/components/schemas/Span" } }
        suggestions:
          type: array
          description: Up to 3 likely products for unmatched item lines (single-receipt GET only).
          items: { $ref: "#/components/schemas/ProductMatch" }

    ReceiptPatch:
      type: object
      description: Only the fields present are changed.
      properties:
        shop_id: { type: integer, format: int64, description: "absent while the receipt is unassigned (shown as Unassigned)" }
        purchased_at: { type: string, format: date-time }
        total_cents: { type: integer, format: int64 }

    ShopSuggestion:
      type: object
      required: [kind, name, key, confidence, evidence, waiting_receipt_ids]
      properties:
        key: { type: string, description: "identity of the suggested shop: shop:<id> for kind=existing, new:<chain>|<street number> for kind=new. Receipts with the same key show ONE card; name, branch and domain are identical for the same key." }
        kind: { type: string, enum: [existing, new] }
        shop_id: { type: integer, format: int64, description: "set when kind=existing" }
        name: { type: string, description: "existing shop's name, or the proposed name of the new shop" }
        chain: { type: string }
        branch: { type: string, description: "street + number, town" }
        domain: { type: string, description: "guessed web domain for the logo, e.g. ah.nl; absent when unknown" }
        confidence: { type: number, format: float }
        evidence: { type: array, items: { type: string }, description: "header rows the suggestion was read from" }
        waiting_receipt_ids:
          type: array
          items: { type: integer, format: int64 }
          description: other unconfirmed receipts from the same branch that accepting would move to the shop
    Receipt:
      type: object
      required: [id, status, review_reasons, created_at, updated_at]
      properties:
        photo_taken_at: { type: string, format: date-time, description: "hint from the photo's EXIF; never the purchase date unless the user picks it" }
        auto_products:
          nullable: true
          description: only on the confirm response, when AUTO_PRODUCTS is on
          allOf: [{ $ref: "#/components/schemas/AutoProductsSummary" }]
        list:
          nullable: true
          description: only on the confirm response. What confirming did to the shopping list; absent if the list step failed.
          allOf: [{ $ref: "#/components/schemas/ReceiptListChecks" }]
        shop_suggestion:
          nullable: true
          description: single-receipt GET only; null/absent when there is nothing to suggest
          allOf: [{ $ref: "#/components/schemas/ShopSuggestion" }]
        id: { type: integer, format: int64 }
        shop_id: { type: integer, format: int64 }
        purchased_at: { type: string, format: date-time }
        total_cents: { type: integer, format: int64 }
        parsed_sum_cents: { type: integer, format: int64 }
        payment_method: { type: string }
        status: { $ref: "#/components/schemas/ReceiptStatus" }
        review_reasons:
          type: array
          items: { type: string, enum: [no_total, total_mismatch, line_math, no_date, low_conf, unparsed_rows] }
        ocr_engine: { type: string }
        ocr_ms: { type: integer, format: int64 }
        parser_version: { type: integer }
        confirmed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        line_count: { type: integer, description: "item lines (excludes discounts, deposits, bags)" }
        unlinked_count: { type: integer, description: "item lines without a product" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ReceiptLine" }

    ReceiptPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Receipt" }
        next_cursor: { type: string }

    Nutrition:
      type: object
      description: Values per 100 g / 100 ml.
      properties:
        per: { type: string, enum: ["100g", "100ml"], default: "100g" }
        energy_kcal: { type: number, format: double }
        fat: { type: number, format: double }
        saturated_fat: { type: number, format: double }
        carbs: { type: number, format: double }
        sugars: { type: number, format: double }
        fibre: { type: number, format: double }
        protein: { type: number, format: double }
        salt: { type: number, format: double }
        source: { type: string, enum: [openfoodfacts, manual], default: manual }

    ProductInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, description: "as sold (usually Dutch)" }
        name_en:
          type: string
          description: >
            English name. Omit to keep a previously typed/Open Food Facts name, or to translate
            automatically; send "" to force automatic translation.
        name_en_source: { type: string, enum: [manual, openfoodfacts], default: manual }
        brand: { type: string }
        category_id: { type: integer, format: int64 }
        barcode: { type: string }
        net_quantity: { type: number, format: double, description: "package size, with net_unit" }
        net_unit: { type: string, enum: [g, ml, pc] }
        openfoodfacts_code: { type: string }
        image_url: { type: string, description: "https Open Food Facts image to download (create only)" }
        nutrition: { $ref: "#/components/schemas/Nutrition" }

    Product:
      type: object
      required: [id, name, has_image, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        name_en: { type: string }
        name_en_source: { type: string, enum: [manual, openfoodfacts, dictionary] }
        name_en_status: { $ref: "#/components/schemas/NameEnStatus" }
        name_en_unknown: { type: array, items: { $ref: "#/components/schemas/Span" } }
        brand: { type: string }
        category_id: { type: integer, format: int64 }
        barcode: { type: string }
        net_quantity: { type: number, format: double }
        net_unit: { type: string, enum: [g, ml, pc] }
        openfoodfacts_code: { type: string }
        has_image: { type: boolean }
        image_url: { type: string, description: "path of GET /v1/products/{id}/image; absent without a photo" }
        created_via: { type: string, enum: [manual, receipt, backfill, barcode] }
        needs_review: { type: boolean }
        review_reason:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ReviewReason" }]
        suggested_merge:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SuggestedMerge" }]
        category_source: { type: string, enum: [rule, off, manual], nullable: true }
        nutrition: { $ref: "#/components/schemas/Nutrition" }
        score: { type: number, format: double, description: "search relevance, only with q" }
        cheapest: { $ref: "#/components/schemas/ShopPrice" }
        last_bought_at: { type: string, format: date-time }
        purchases: { type: integer, description: "receipts it was bought on" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReviewReason:
      type: string
      enum: [near_match, barcode_name_match, odd_name, no_category, barcode_minimal, barcode_off_unavailable]

    SuggestedMerge:
      type: object
      required: [product_id, name, score]
      properties:
        product_id: { type: integer, format: int64 }
        name: { type: string }
        name_en: { type: string }
        brand: { type: string }
        score: { type: number, format: double }

    AutoProductsSummary:
      type: object
      required: [linked, created, needs_review]
      properties:
        linked: { type: integer }
        created: { type: integer }
        needs_review: { type: integer }
        error: { type: string, nullable: true }

    BarcodeCreateResult:
      type: object
      required: [status, created_now, product, unmatched_lines]
      properties:
        status: { type: string, enum: [known, created, created_minimal] }
        created_now: { type: boolean, description: "true only on the 201 that created it; false on every repeat" }
        off_status: { type: string, enum: [found, not_found, unavailable], description: "absent when status = known" }
        product: { $ref: "#/components/schemas/Product" }
        merge_suggestion:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SuggestedMerge" }]
        unmatched_lines:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/UnmatchedLine" }

    ReviewSourceLine:
      type: object
      required: [line_id, receipt_id, raw_text, shop_name, line_total_cents]
      properties:
        line_id: { type: integer, format: int64 }
        receipt_id: { type: integer, format: int64 }
        raw_text: { type: string }
        shop_name: { type: string }
        purchased_at: { type: string, format: date-time }
        line_total_cents: { type: integer, format: int64 }

    ReviewItem:
      type: object
      required: [product, reason, source_line_count, source_lines]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        reason: { $ref: "#/components/schemas/ReviewReason" }
        suggested_merge:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SuggestedMerge" }]
        source_line_count: { type: integer }
        source_lines:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ReviewSourceLine" }

    ReviewQueue:
      type: object
      required: [total, counts, items]
      properties:
        total: { type: integer }
        counts:
          type: object
          description: per-reason totals for the whole queue (every reason present)
          additionalProperties: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReviewItem" }
        same_kind_total:
          type: integer
          description: open "same kind of item" suggestions (GET /v1/product-groups/suggestions); also shown in the review queue badge

    ReviewInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [accept, merge, keep_separate, discard] }
        category_id: { type: integer, format: int64, description: "accept only" }
        name: { type: string, description: "accept only" }
        into_product_id: { type: integer, format: int64, description: "merge only; default: the suggested product" }

    ProductRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    ReviewResult:
      type: object
      required: [product]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        merge_id: { type: integer, format: int64, description: "merge" }
        discard_id: { type: integer, format: int64, description: "discard (also usable as the id for undo)" }
        kind: { type: string, enum: [merge, discard] }
        merged_away: { $ref: "#/components/schemas/ProductRef" }
        lines_moved: { type: integer }
        aliases_moved: { type: integer }
        lines_unlinked: { type: integer }

    MergeResult:
      type: object
      required: [merge_id, kind, product, merged_away, lines_moved, aliases_moved]
      properties:
        merge_id: { type: integer, format: int64 }
        kind: { type: string, enum: [merge] }
        product: { $ref: "#/components/schemas/Product" }
        merged_away: { $ref: "#/components/schemas/ProductRef" }
        lines_moved: { type: integer }
        aliases_moved: { type: integer }

    SplitResult:
      type: object
      required: [merge_id, kind, product, lines_moved]
      properties:
        merge_id: { type: integer, format: int64 }
        kind: { type: string, enum: [split] }
        product: { $ref: "#/components/schemas/Product" }
        lines_moved: { type: integer }

    UndoResult:
      type: object
      required: [kind, product, into, lines_restored, lines_skipped]
      properties:
        kind: { type: string, enum: [merge, discard, split] }
        product: { $ref: "#/components/schemas/Product", description: "restored product, with its review state" }
        into: { $ref: "#/components/schemas/Product", description: "the survivor (same as product for discard)" }
        lines_restored: { type: integer }
        lines_skipped: { type: integer, description: "lines the user relinked since" }

    BackfillState:
      type: object
      required: [state, dry_run, receipts_total, receipts_done, linked, created, needs_review]
      properties:
        state: { type: string, enum: [idle, running, done, failed] }
        dry_run: { type: boolean }
        receipts_total: { type: integer }
        receipts_done: { type: integer }
        linked: { type: integer }
        created: { type: integer }
        needs_review: { type: integer }
        skipped_receipt_ids: { type: array, items: { type: integer, format: int64 }, description: "receipts left out on request" }
        error: { type: string }

    OpenFoodFactsPrefill:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        name_en: { type: string, description: "send as name_en with name_en_source=openfoodfacts" }
        brand: { type: string }
        net_quantity: { type: number, format: double }
        net_unit: { type: string, enum: [g, ml] }
        image_url: { type: string }
        nutrition: { $ref: "#/components/schemas/Nutrition" }

    BarcodeLookup:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [local, openfoodfacts] }
        product: { $ref: "#/components/schemas/Product" }
        prefill: { $ref: "#/components/schemas/OpenFoodFactsPrefill" }

    ProductMatch:
      type: object
      required: [product_id, name, score]
      properties:
        product_id: { type: integer, format: int64 }
        name: { type: string }
        name_en: { type: string }
        brand: { type: string }
        score: { type: number, format: double }

    Alias:
      type: object
      required: [id, text, product_id, created_at]
      properties:
        id: { type: integer, format: int64 }
        text: { type: string, description: normalised receipt text }
        shop_id: { type: integer, format: int64 }
        shop_name: { type: string }
        product_id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    UnmatchedLine:
      type: object
      required: [line, shop_name, score]
      properties:
        line: { $ref: "#/components/schemas/ReceiptLine" }
        shop_id: { type: integer, format: int64, description: "absent for an unassigned receipt (shop_name is then Unassigned)" }
        shop_name: { type: string }
        purchased_at: { type: string, format: date-time }
        score: { type: number, format: double }

    LinkInput:
      type: object
      properties:
        product_id: { type: integer, format: int64, nullable: true }
        remember: { type: boolean, default: true }

    LinkResult:
      type: object
      required: [line, also_linked, alias_created]
      properties:
        line: { $ref: "#/components/schemas/ReceiptLine" }
        also_linked: { type: integer, format: int64, description: "other lines linked through the alias" }
        alias_created: { type: boolean }

    SpendBucket:
      type: object
      required: [key, label, cents, receipts]
      properties:
        key: { type: string, description: "2026-10-03 | 2026-W40 | 2026-10 | shop id | category id | none | product id" }
        label: { type: string }
        cents: { type: integer, format: int64 }
        receipts: { type: integer }
        qty: { type: number, format: double, description: "group_by=product: quantity bought, in unit" }
        unit: { type: string, enum: [pc, kg, l], description: "group_by=product" }
        split:
          type: array
          description: "with split_by: parts of this bucket, largest first (absent when the bucket has no spend)"
          items:
            type: object
            required: [key, label, cents]
            properties:
              key: { type: string }
              label: { type: string }
              cents: { type: integer, format: int64 }

    Spend:
      type: object
      required: [from, to, group_by, total_cents, receipts, buckets]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, description: exclusive }
        group_by: { type: string, enum: [day, week, month, shop, category, product] }
        split_by: { type: string, enum: [category, shop] }
        total_cents: { type: integer, format: int64 }
        receipts: { type: integer }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/SpendBucket" }

    PricePoint:
      type: object
      required: [line_id, shop_id, shop_name, at, qty, unit, paid_cents, unit_cents, base_unit]
      properties:
        line_id: { type: integer, format: int64 }
        shop_id: { type: integer, format: int64 }
        shop_name: { type: string }
        at: { type: string, format: date-time }
        qty: { type: number, format: double }
        unit: { type: string, enum: [pc, kg, l] }
        paid_cents: { type: integer, format: int64, description: after linked discounts }
        unit_cents: { type: integer, format: int64, description: per base unit }
        base_unit: { type: string, enum: [kg, l, pc] }

    ShopPrice:
      type: object
      required: [shop_id, shop_name, base_unit, latest_unit_cents, latest_at, min_unit_cents, max_unit_cents, purchases, cheapest]
      properties:
        shop_id: { type: integer, format: int64 }
        shop_name: { type: string }
        base_unit: { type: string, enum: [kg, l, pc] }
        latest_unit_cents: { type: integer, format: int64 }
        latest_at: { type: string, format: date-time }
        min_unit_cents: { type: integer, format: int64 }
        max_unit_cents: { type: integer, format: int64 }
        purchases: { type: integer }
        cheapest: { type: boolean }

    PriceChange:
      type: object
      required: [product_id, product_name, shop_id, shop_name, base_unit, old_unit_cents, new_unit_cents, pct, latest_at]
      properties:
        product_id: { type: integer, format: int64 }
        product_name: { type: string }
        shop_id: { type: integer, format: int64 }
        shop_name: { type: string }
        base_unit: { type: string, enum: [kg, l, pc] }
        old_unit_cents: { type: integer, format: int64 }
        new_unit_cents: { type: integer, format: int64 }
        pct: { type: number, format: double }
        latest_at: { type: string, format: date-time }

    FrequentItem:
      type: object
      required: [product_id, product_name, purchases, last_bought, median_interval_days, days_since, due]
      properties:
        product_id: { type: integer, format: int64 }
        product_name: { type: string }
        purchases: { type: integer }
        last_bought: { type: string, format: date-time }
        median_interval_days: { type: number, format: double }
        days_since: { type: number, format: double }
        due: { type: boolean }

    ListItemInput:
      type: object
      properties:
        client_id: { type: string, maxLength: 100, description: "client-generated id (UUID); makes POST /v1/list idempotent" }
        text: { type: string }
        product_id: { type: integer, format: int64 }
        qty: { type: number, format: double }
        note: { type: string }
        group_id: { type: integer, format: int64, description: "POST only: put the item in this group (checklist or template). Omit for the main list. Use POST /v1/list/{id}/move to move an item later." }
        source: { type: string, enum: [user, assistant], default: user }

    ListItem:
      type: object
      required: [id, text, created_at]
      properties:
        id: { type: integer, format: int64 }
        text: { type: string }
        product_id: { type: integer, format: int64 }
        product_name: { type: string }
        qty: { type: number, format: double }
        note: { type: string }
        checked_at: { type: string, format: date-time }
        check_source:
          type: string
          enum: [manual, receipt]
          description: present when checked. "receipt" = checked automatically (or by accepting a suggestion) because of a confirmed receipt.
        checked_receipt_id: { type: integer, format: int64, description: "the receipt that checked it (check_source=receipt)" }
        checked_line_id: { type: integer, format: int64, description: "the receipt line that matched" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cheapest: { $ref: "#/components/schemas/ShopPrice" }
        group_id: { type: integer, format: int64, description: "the group this item is in; absent on the main list" }
        source: { type: string, enum: [user, assistant], description: "who added it" }
        rev: { type: integer, format: int64, description: "list write counter value of the last write to this item" }
        other_group_ids: { type: array, items: { type: integer, format: int64 }, description: "live checklists where the same product is also open (as of this response)" }
        on_main_list: { type: boolean, description: "the same product is also open on the main list (as of this response)" }

    ListGroup:
      type: object
      required: [id, name, kind, source, sort, created_at, updated_at, rev, item_count, checked_count]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [checklist, template] }
        note: { type: string }
        source: { type: string, enum: [user, assistant], description: "who made the group; assistant groups show an Assistant badge" }
        external_ref: { type: string, description: "idempotency key an assistant chose" }
        sort: { type: integer, format: int64, description: "display order, ascending" }
        archived_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: "also moves when items are added to, moved into/out of or removed from the group" }
        rev: { type: integer, format: int64 }
        item_count: { type: integer, format: int64, description: "as of this response; phones normally count their own copy" }
        checked_count: { type: integer, format: int64 }
        items: { type: array, items: { $ref: "#/components/schemas/ListItem" }, description: "present when the group is loaded whole (single group, create, restore, include_items)" }
        item_ids: { type: array, items: { type: integer, format: int64 }, description: "create, instantiate and save-as-template only: ids in the order of the request's items (instantiate: the template's item order)" }

    ListGroupInput:
      type: object
      required: [name]
      properties:
        client_id: { type: string, maxLength: 100, description: "client-generated id (UUID); makes the create idempotent" }
        name: { type: string, minLength: 1, maxLength: 100 }
        note: { type: string }
        kind: { type: string, enum: [checklist, template], default: checklist }
        source: { type: string, enum: [user, assistant], default: user }
        external_ref: { type: string, maxLength: 100, description: "idempotency key for assistants, unique per source" }
        sort: { type: integer, format: int64, description: "default: after the last group" }
        items:
          type: array
          maxItems: 200
          description: "ordered lines; each needs text or product_id. client_id and group_id on a line are ignored."
          items: { $ref: "#/components/schemas/ListItemInput" }

    ListGroupPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        note: { type: string, description: "empty string clears" }
        sort: { type: integer, format: int64 }
        archived: { type: boolean, description: "true archives (archived_at is set), false restores" }

    ListGroupItemsInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/ListItemInput" }
        source: { type: string, enum: [user, assistant], default: user }

    ListGroupCopyInput:
      type: object
      properties:
        client_id: { type: string, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 100, description: "default: the source group's name" }

    ListGroupDeleted:
      type: object
      required: [group_id, kept, deleted_item_ids, restore_until]
      properties:
        group_id: { type: integer, format: int64 }
        kept: { type: array, items: { $ref: "#/components/schemas/ListItem" }, description: "items moved to the main list (items=keep)" }
        deleted_item_ids: { type: array, items: { type: integer, format: int64 } }
        restore_until: { type: string, format: date-time, description: "POST /v1/list/groups/{id}/restore works until then" }

    ListSuggestion:
      type: object
      required: [id, item_id, item_text, receipt_id, line_text, score, reason, created_at]
      properties:
        id: { type: integer, format: int64 }
        item_id: { type: integer, format: int64 }
        item_text: { type: string }
        receipt_id: { type: integer, format: int64 }
        line_id: { type: integer, format: int64 }
        line_text: { type: string, description: "the receipt line as printed" }
        score: { type: number, format: double }
        reason:
          type: string
          enum: [match, substitute]
          description: "match = text looks like the line; substitute = a different product of the same category"
        created_at: { type: string, format: date-time }

    ReceiptListChecks:
      type: object
      required: [checked, reduced, suggestions]
      properties:
        checked: { type: array, items: { $ref: "#/components/schemas/ListItem" }, description: "items checked off by this receipt" }
        reduced: { type: array, items: { $ref: "#/components/schemas/ListItem" }, description: 'items kept open with a smaller qty and the note "1 of 3 bought"' }
        suggestions: { type: array, items: { $ref: "#/components/schemas/ListSuggestion" }, description: "new suggestions from this receipt" }

    Device:
      type: object
      required: [id, name, created_at, current]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        current: { type: boolean, description: "the device making this request" }

    NameEnStatus:
      type: string
      enum: [manual, openfoodfacts, dictionary, partial, missing]

    Span:
      type: object
      description: >
        An unknown word. start/end are UTF-16 offsets (end exclusive, = NSRange) into the displayed
        string: the English for partial, the Dutch for missing.
      required: [word, key, start, end]
      properties:
        word: { type: string, description: as written, e.g. "Calvé" }
        key: { type: string, description: glossary key, e.g. "calve" }
        start: { type: integer }
        end: { type: integer }

    GlossaryTermInput:
      type: object
      properties:
        english: { type: string, maxLength: 80 }
        keep_as_is: { type: boolean, default: false }

    GlossaryTerm:
      type: object
      required: [dutch, keep_as_is, products_count, updated_at]
      properties:
        dutch: { type: string }
        english: { type: string }
        keep_as_is: { type: boolean }
        products_count: { type: integer }
        updated_at: { type: string, format: date-time }

    ShopRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        chain: { type: string }

    ProductGroupMember:
      type: object
      required: [product_id, name, base_unit, pack_size_known, shops, purchases]
      properties:
        product_id: { type: integer, format: int64 }
        name: { type: string }
        name_en: { type: string }
        brand: { type: string }
        category_id: { type: integer, format: int64, nullable: true }
        base_unit: { type: string, enum: [kg, l, pc] }
        pack_size_known: { type: boolean }
        shops: { type: array, items: { $ref: "#/components/schemas/ShopRef" }, description: "shops it was bought at (ok receipts)" }
        purchases: { type: integer }
        last_bought_at: { type: string, format: date-time, nullable: true }

    ProductGroup:
      type: object
      required: [id, name, base_unit, created_at, updated_at, members, shop_count]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        category_id: { type: integer, format: int64, nullable: true }
        base_unit: { type: string, enum: [kg, l, pc], description: "what the members are priced in; pc when no member has a pack size" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        members: { type: array, items: { $ref: "#/components/schemas/ProductGroupMember" } }
        shop_count: { type: integer, description: "shops the members were bought at; plans need 2" }

    ProductGroupConfirm:
      type: object
      required: [product_ids]
      properties:
        product_ids: { type: array, items: { type: integer, format: int64 }, minItems: 2, maxItems: 50 }
        name: { type: string, maxLength: 100 }

    ProductGroupResult:
      type: object
      required: [group, op_id, dissolved_group_ids]
      properties:
        group: { allOf: [{ $ref: "#/components/schemas/ProductGroup" }], nullable: true }
        op_id: { type: integer, format: int64, description: "pass to /v1/product-group-ops/{id}/undo" }
        dissolved_group_ids: { type: array, items: { type: integer, format: int64 }, description: "groups that are gone (merged into another, or left with fewer than two products)" }

    SuggestedProduct:
      type: object
      required: [product_id, name, shops]
      properties:
        product_id: { type: integer, format: int64 }
        name: { type: string }
        name_en: { type: string }
        group_id: { type: integer, format: int64, nullable: true, description: "the group it is already in" }
        shops: { type: array, items: { $ref: "#/components/schemas/ShopRef" } }

    ProductGroupSuggestion:
      type: object
      required: [a, b, score, reason]
      properties:
        a: { $ref: "#/components/schemas/SuggestedProduct" }
        b: { $ref: "#/components/schemas/SuggestedProduct" }
        score: { type: number, description: "0.80 to 1" }
        reason: { type: string, enum: [similar_name_other_shop] }

    ListPlanSettings:
      type: object
      required: [extra_stop_cents, max_stops]
      properties:
        extra_stop_cents: { type: integer, minimum: 0, maximum: 2000, description: "default 250" }
        max_stops: { type: integer, minimum: 1, maximum: 3, description: "most shops a plan may use, default 2" }

    ListPlanSettingsPatch:
      type: object
      properties:
        extra_stop_cents: { type: integer, minimum: 0, maximum: 2000 }
        max_stops: { type: integer, minimum: 1, maximum: 3 }

    PlanStore:
      type: object
      required: [shop_id, name, item_count, estimate_cents, unpriced_count, is_usual, receipts_90d]
      properties:
        shop_id: { type: integer, format: int64 }
        name: { type: string }
        chain: { type: string }
        item_count: { type: integer }
        estimate_cents: { type: integer, format: int64, description: "sum of the items that have an estimate here" }
        unpriced_count: { type: integer, description: "items here without an estimate" }
        is_usual: { type: boolean }
        receipts_90d: { type: integer }

    PlanPoint:
      type: object
      required: [at, unit_cents, paid_cents, product_id, product_name]
      properties:
        at: { type: string, format: date-time }
        unit_cents: { type: integer, format: int64 }
        paid_cents: { type: integer, format: int64, description: "after discounts" }
        product_id: { type: integer, format: int64 }
        product_name: { type: string }

    PlanShopPrice:
      type: object
      required: [shop_id, shop_name, unit_cents, base_unit, purchases, latest_at, age_days, is_usual, points]
      properties:
        shop_id: { type: integer, format: int64 }
        shop_name: { type: string }
        unit_cents: { type: integer, format: int64, description: "median of points, per base_unit" }
        base_unit: { type: string, enum: [kg, l, pc] }
        purchases: { type: integer, description: "purchases in the window, not only the last 3" }
        latest_at: { type: string, format: date-time }
        age_days: { type: integer }
        is_usual: { type: boolean }
        points: { type: array, items: { $ref: "#/components/schemas/PlanPoint" }, description: "the purchases the median is taken from, newest first (at most 3)" }

    PlanOtherPrice:
      type: object
      required: [shop_id, unit_cents]
      properties:
        shop_id: { type: integer, format: int64 }
        unit_cents: { type: integer, format: int64 }

    PairConfirmation:
      type: object
      description: An unconfirmed "same kind of item" question that would give this item a comparison. Answer with /v1/product-groups/confirm or /deny.
      required: [product_a, product_b, name_a, name_b, shop_a, shop_b, shop_a_id, shop_b_id]
      properties:
        product_a: { type: integer, format: int64 }
        product_b: { type: integer, format: int64 }
        name_a: { type: string }
        name_b: { type: string }
        shop_a: { type: string }
        shop_b: { type: string }
        shop_a_id: { type: integer, format: int64 }
        shop_b_id: { type: integer, format: int64 }

    PlanItem:
      type: object
      required: [item_id, text, qty, status, pack_size_known, saving_cents, other_prices, prices, confidence, explanation]
      properties:
        item_id: { type: integer, format: int64 }
        text: { type: string }
        product_id: { type: integer, format: int64, nullable: true }
        product_group_id: { type: integer, format: int64, nullable: true }
        group_id: { type: integer, format: int64, nullable: true, description: "the checklist the item is in" }
        qty: { type: number }
        shop_id: { type: integer, format: int64, nullable: true, description: "where to buy it; the usual shop unless the plan moves it; null without a usual shop" }
        status:
          type: string
          enum: [compared, only_here, only_elsewhere, no_price]
          description: |
            compared: priced at the usual shop and at another candidate. only_here: usual shop only. only_elsewhere:
            priced at another shop only; it stays with the usual shop without an estimate and never carries a saving.
            no_price: no fresh price anywhere.
        no_price_reason: { type: string, enum: [not_linked, never_bought, stale, no_usual_shop] }
        unit_cents: { type: integer, format: int64, nullable: true, description: "price per base_unit at shop_id" }
        base_unit: { type: string, enum: [kg, l, pc] }
        basis: { type: string, enum: [per_kg, per_l, per_piece] }
        pack_size_known: { type: boolean, description: "false: compared per piece because no pack size is known" }
        estimate_cents: { type: integer, format: int64, nullable: true, description: "unit price times the pack size (or usual weight) times qty" }
        saving_cents: { type: integer, format: int64, description: "counted saving if the plan moves this item, else 0" }
        other_prices: { type: array, items: { $ref: "#/components/schemas/PlanOtherPrice" }, description: "fresh prices at the other shops" }
        prices: { type: array, items: { $ref: "#/components/schemas/PlanShopPrice" }, description: "every shop with a fresh price, cheapest first, with the purchases behind it" }
        confidence:
          type: array
          items: { type: string, enum: [seen_once, old_price, different_pack, not_enough_data] }
          description: "seen_once: a compared price rests on one purchase. old_price: older than half the window. different_pack: pack size unknown, packs differ by over 20%, or other units were left out. not_enough_data: priced at one shop only."
        last_seen: { type: string, format: date-time, nullable: true }
        last_seen_shop_id: { type: integer, format: int64, nullable: true }
        explanation: { type: string, description: "English sentence with prices and dates; the app may build its own from `prices`" }
        pair_confirmation: { allOf: [{ $ref: "#/components/schemas/PairConfirmation" }], nullable: true }

    PlanSummary:
      type: object
      required: [item_count, priced_count, compared_count, no_price_count, per_piece_count, saving_cents, gross_saving_cents, extra_stops, extra_stop_cents, extra_stop_total_cents, max_stops, one_shop_fine, split_saving_cents, baseline_cents, plan_cents, confidence, coverage]
      properties:
        item_count: { type: integer }
        priced_count: { type: integer, description: "items with a fresh price somewhere" }
        compared_count: { type: integer, description: "items priced at the usual shop and at another shop" }
        no_price_count: { type: integer }
        per_piece_count: { type: integer, description: "priced items compared per piece because the pack size is unknown" }
        saving_cents: { type: integer, format: int64, description: "net: gross minus the extra stops. 0 unless status=split" }
        gross_saving_cents: { type: integer, format: int64 }
        extra_stops: { type: integer }
        extra_stop_cents: { type: integer, format: int64, description: "cost applied per extra stop" }
        extra_stop_total_cents: { type: integer, format: int64 }
        max_stops: { type: integer }
        one_shop_fine: { type: boolean }
        split_saving_cents: { type: integer, format: int64, description: "one_shop_fine: gross saving of the best split, before its stops" }
        baseline_cents: { type: integer, format: int64, description: "the compared items at the usual shop alone" }
        plan_cents: { type: integer, format: int64, description: "the same items in the plan" }
        confidence: { type: string, enum: [none, low, medium, high] }
        coverage: { type: number, description: "compared_count / item_count, 0..1" }

    PlanBasis:
      type: object
      required: [window_days, fresh_window_days, median_of, comparison, pieces_note]
      properties:
        window_days: { type: integer }
        fresh_window_days: { type: integer }
        median_of: { type: integer }
        comparison: { type: string }
        pieces_note: { type: string }

    ListPlan:
      type: object
      required: [computed_at, list_rev, status, stores, items, summary, basis]
      properties:
        computed_at: { type: string, format: date-time }
        list_rev: { type: integer, format: int64, description: "the list's rev the plan was made for" }
        status: { type: string, enum: [split, one_shop_fine, not_enough_data] }
        usual_shop_id: { type: integer, format: int64, nullable: true }
        stores: { type: array, items: { $ref: "#/components/schemas/PlanStore" }, description: "usual shop first; only shops the plan uses" }
        items: { type: array, items: { $ref: "#/components/schemas/PlanItem" }, description: "in list order" }
        summary: { $ref: "#/components/schemas/PlanSummary" }
        basis: { $ref: "#/components/schemas/PlanBasis" }
